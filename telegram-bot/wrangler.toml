# 这里只放不怕被人看见的东西。
# token 和 key 走 wrangler secret put，不进这个文件、不进 git。

name = "su-tg-bot"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Cloudflare 自己托管的模型。绑上就能用，不要 key、不要卡，
# 每天白送 10000 neurons。机器人默认走这条路。
[ai]
binding = "AI"

[vars]
# 谁能用。逗号隔开的 chat id —— 先随便给机器人发句话，
# 它会把你的 id 告诉你，填进来再 deploy 一次。
# 不填的话谁都用不了（机器人地址是公开的，别让陌生人烧你的额度）。
ALLOWED_CHATS = ""

# 默认模型。1b / 3b / 8b / 70b，或者直接写 @cf/ 开头的完整 ID。
# 聊天里 /model 可以临时换，换了以那个为准。
MODEL = "8b"

# 一次最多让它说多少 token。免费额度主要烧在输出上，
# 调小就更耐用；调大它话痨起来一条能顶好几条。
MAX_TOKENS = "800"

# 想改机器人的口气就改这句
SYSTEM_PROMPT = "你是苏家的学习助手。回答简明、口语化，别写成论文。讲英语知识时给出中文解释和例句；用户用中文问就用中文答。"

# 只有 /model deepseek 才用得上，不用 DeepSeek 就别管这行
DEEPSEEK_MODEL = "deepseek-chat"

# 上下文、选的模型、用量都存这儿。强烈建议绑上（KV 免费额度也够用）：
#   wrangler kv namespace create BOT_KV
# 把命令吐出来的 id 填进去，然后把下面三行的 # 去掉。
# 不绑也能聊，只是记不住上文、换不了模型、看不了 /free。
# [[kv_namespaces]]
# binding = "BOT_KV"
# id = "把 wrangler 给的 id 填这儿"
