<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>背景小样 · QQ风流动玻璃</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  min-height:100vh;overflow-x:hidden;
  font-family:Inter,-apple-system,"PingFang SC",sans-serif;
  background:linear-gradient(160deg,#eaf3ff 0%,#f2ecff 38%,#e8f9ff 70%,#f6f0ff 100%);
  background-size:220% 220%;
  animation:flow 16s ease-in-out infinite alternate;
  position:relative;
}
@keyframes flow{0%{background-position:0% 0%}100%{background-position:100% 100%}}
.blob{position:fixed;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none;will-change:transform}
.b1{width:46vw;height:46vw;background:radial-gradient(circle at 30% 30%,#9ec9ff,#c4b5ff);top:-10vw;left:-8vw;animation:drift1 22s ease-in-out infinite alternate}
.b2{width:38vw;height:38vw;background:radial-gradient(circle at 60% 40%,#a5f0e6,#9ec9ff);bottom:-6vw;right:-6vw;animation:drift2 26s ease-in-out infinite alternate}
.b3{width:30vw;height:30vw;background:radial-gradient(circle at 40% 60%,#ffd7ec,#c4b5ff);top:38%;left:56%;animation:drift3 30s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(9vw,7vh) scale(1.12)}}
@keyframes drift2{to{transform:translate(-7vw,-9vh) scale(1.08)}}
@keyframes drift3{to{transform:translate(-10vw,6vh) scale(.92)}}
.wrap{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:60px 20px}
h1{font-size:1.9rem;color:#25335c;letter-spacing:.02em}
.sub{color:#7385ad;margin-top:6px;font-size:.95rem}
.card{
  margin-top:26px;border-radius:24px;padding:26px 24px;
  background:rgba(255,255,255,.55);
  border:1px solid rgba(255,255,255,.8);
  box-shadow:0 20px 60px rgba(90,120,200,.14);
  -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
  color:#31406b;
}
.card h2{font-size:1.15rem;margin-bottom:8px}
.card p{font-size:.92rem;color:#5d6d99;line-height:1.8}
.btn{display:inline-block;margin-top:16px;padding:13px 30px;border-radius:999px;border:0;
  background:linear-gradient(135deg,#4d8dff,#7a5cff);color:#fff;font-size:.95rem;font-weight:700;
  box-shadow:0 12px 30px rgba(90,110,255,.35);cursor:pointer}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div>
<div class="wrap">
  <h1>流动玻璃背景 · 小样</h1>
  <div class="sub">QQ官网那种感觉 · 纯CSS · 无图片 · 手机流畅</div>
  <div class="card">
    <h2>玻璃卡片</h2>
    <p>背景在慢慢流动，三个大光斑各自漂移。卡片是磨砂玻璃，能透出后面的颜色。这一套可以铺到任何一个站上，颜色随便换——比如换成深空金就是你网站那个气质，换成粉色就是霏雅小岛的气质。</p>
    <button class="btn">按钮长这样</button>
  </div>
</div>
</body>
</html>
