<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1a2e">
<title>博远的学习星球</title>
<style>
:root{--bg:#0e1a2e;--bg2:#16294a;--cream:#f3efe2;--gold:#ffd479;--mint:#7fe0c0;--pink:#ff9ec4;--muted:#93a4c0;--line:rgba(243,239,226,.14)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC",system-ui;background:radial-gradient(ellipse at 50% 0%,#1d3763,#0a1424 70%);color:var(--cream);min-height:100vh;padding:0 0 84px;line-height:1.65}
header{padding:18px 18px 12px;text-align:center}
header h1{font-size:1.15rem;letter-spacing:.1em}
.stars{margin-top:8px;font-size:1.5rem;font-weight:800;color:var(--gold)}
.stars small{display:block;font-size:.72rem;color:var(--muted);font-weight:400;letter-spacing:.1em}
main{max-width:600px;margin:0 auto;padding:6px 14px}
.page{display:none}.page.on{display:block}
.card{background:rgba(243,239,226,.06);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h2{font-size:.95rem;color:var(--gold);margin-bottom:10px;letter-spacing:.06em}
.q{font-size:1.25rem;line-height:1.8;margin:8px 0 14px;text-align:center}
.q .big{font-size:2.4rem;display:block;margin-bottom:6px}
.opt{display:block;width:100%;text-align:left;background:rgba(243,239,226,.07);border:1px solid var(--line);border-radius:14px;padding:13px 16px;margin-bottom:9px;font-size:1rem;color:var(--cream);font-family:inherit;cursor:pointer}
.opt.right{background:rgba(127,224,192,.22);border-color:var(--mint);color:var(--mint);font-weight:700}
.opt.wrong{background:rgba(255,158,196,.18);border-color:var(--pink);color:var(--pink)}
button.main{display:block;width:100%;border:none;border-radius:16px;padding:15px;font-size:1.02rem;font-family:inherit;cursor:pointer;background:linear-gradient(135deg,#ffd479,#e0a63c);color:#20130a;font-weight:800;letter-spacing:.05em}
button.ghost{background:rgba(243,239,226,.08);color:var(--cream);border:1px solid var(--line)}
.reward{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px dashed var(--line)}
.reward:last-child{border:none}
.reward .n{font-size:.98rem}
.reward .c{font-size:.75rem;color:var(--muted)}
.reward button{border:none;border-radius:12px;padding:9px 15px;font-family:inherit;font-size:.85rem;cursor:pointer;background:var(--mint);color:#0a2018;font-weight:700;white-space:nowrap}
.reward button:disabled{background:rgba(243,239,226,.12);color:var(--muted)}
.wish{text-align:center;padding:22px 0}
.wishbox{font-size:2.6rem;margin:10px 0}
.wishtext{font-size:1.05rem;color:var(--gold);min-height:2.6em;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;background:rgba(10,20,36,.97);border-top:1px solid var(--line);display:flex;padding:8px 2px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:none;color:var(--muted);font-size:.66rem;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button span{font-size:1.35rem;line-height:1}
nav button.on{color:var(--gold)}
.toast{position:fixed;left:50%;top:18%;transform:translateX(-50%);background:var(--gold);color:#20130a;padding:13px 24px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:opacity .25s;z-index:9}
.toast.on{opacity:1}
.tip{font-size:.74rem;color:var(--muted);text-align:center;margin:10px 0}
.streakbar{display:flex;gap:5px;justify-content:center;margin-top:10px}
.streakbar i{width:11px;height:11px;border-radius:50%;background:rgba(243,239,226,.14);display:block}
.streakbar i.on{background:var(--gold)}
</style>
</head>
<body>
<header>
  <h1>🪐 博远的学习星球</h1>
  <div class="stars"><span id="starCount">0</span> ⭐<small>今天已得 <b id="todayStars">0</b> 颗 · 连续 <b id="streak">0</b> 天</small></div>
  <div class="streakbar" id="sbar"></div>
</header>
<main>
  <section class="page on" id="p-learn">
    <div class="card">
      <h2>今天学什么</h2>
      <button class="main" data-sub="chinese" style="margin-bottom:9px">📖 语文 · 三年级上册</button>
      <button class="main ghost" data-sub="quran" style="margin-bottom:9px">🕌 古兰经</button>
      <button class="main ghost" data-sub="english">🔤 英语单词</button>
    </div>
    <div class="card">
      <h2>🌟 找星星老师上课</h2>
      <div style="text-align:center">
        <div id="tOrb" style="width:86px;height:86px;border-radius:50%;margin:2px auto 10px;display:flex;align-items:center;justify-content:center;font-size:2rem;background:radial-gradient(circle at 34% 30%,#2b5db0,#16294a);border:2px solid rgba(255,212,121,.5);transition:box-shadow .25s">🌙</div>
        <button class="main" id="tBtn">🎓 开始上课</button>
        <div id="tStatus" class="tip" style="min-height:2.2em;margin:8px 0 0">按一下，老师就来了。想学哪科就跟她说。</div>
        <div id="tUsage" class="tip" style="margin:4px 0 0"></div>
      </div>
    </div>
    <div class="card" id="quizCard" style="display:none">
      <h2 id="quizTitle">题目</h2>
      <div class="q" id="q"></div>
      <button class="opt" id="replayQ" style="text-align:center;margin-bottom:12px">🔊 再听一次</button>
      <div id="opts"></div>
      <div class="tip" id="prog"></div>
    </div>
  </section>

  <section class="page" id="p-reward">
    <div class="card">
      <h2>用星星换奖励</h2>
      <div id="rewards"></div>
    </div>
    <div class="card">
      <h2>手机时间</h2>
      <div class="tip" style="text-align:left;margin:0 0 8px">每 10 颗星 = 10 分钟手机时间。换到的时间记在这里，玩之前给爸爸看一眼。</div>
      <div class="reward"><div><div class="n">兑换 10 分钟</div><div class="c">花 10 ⭐</div></div><button id="buyTime">换</button></div>
      <div class="tip" style="margin-top:10px">你有 <b id="phoneMin">0</b> 分钟没用的手机时间</div>
    </div>
  </section>

  <section class="page" id="p-wish">
    <div class="card wish">
      <h2>愿望盲盒</h2>
      <div class="tip">里面装着什么，只有爸爸知道 —— 攒够 30 ⭐ 抽一次，抽到什么算什么！</div>
      <div class="wishbox" id="wishBox">🎁</div>
      <div class="wishtext" id="wishText">还没抽</div>
      <button class="main" id="drawWish" style="margin-top:14px">抽一次（30 ⭐）</button>
      <div class="tip" id="wishLog" style="margin-top:14px"></div>
    </div>
  </section>
</main>

<nav>
  <button class="on" data-p="learn"><span>📚</span>学习</button>
  <button data-p="reward"><span>🎁</span>奖励</button>
  <button data-p="wish"><span>🔮</span>愿望盒</button>
</nav>
<div class="toast" id="toast"></div>

<script>

/* ===== 真人语音（花名册声线，预生成 MP3；缺文件才退回系统音） ===== */
var VOICE_IDX=null, _vplayer=new Audio();
fetch("kidaudio/index.json").then(function(r){return r.json()}).then(function(j){VOICE_IDX=j}).catch(function(){});
function speakRoster(text){
  if(!text)return;
  var key=String(text).trim();
  if(VOICE_IDX&&VOICE_IDX[key]){
    try{_vplayer.pause()}catch(e){}
    _vplayer=new Audio("kidaudio/"+VOICE_IDX[key]);
    _vplayer.play().catch(function(){sysSpeak(key)});
    return;
  }
  sysSpeak(key);
}
function sysSpeak(text){
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(text);
    u.lang=/[\u0600-\u06ff]/.test(text)?"ar-AE":/[\u4e00-\u9fff]/.test(text)?"zh-CN":"en-US";
    u.rate=.9;speechSynthesis.speak(u);
  }catch(e){}
}

/* ================= 题库 ================= */
const BANK={
chinese:{title:"语文 · 人教版三年级上册",items:[
 {q:"第一课《大青树下的小学》里，同学们是从哪些地方走来的？",o:["山坡上、坪坝里、小路上","城市、乡村、海边","学校、家里、公园"],a:0},
 {q:"《花的学校》是哪位诗人写的？",o:["泰戈尔","冰心","叶圣陶"],a:0},
 {q:"《不懂就要问》讲的是谁小时候的故事？",o:["孙中山","毛泽东","鲁迅"],a:0},
 {q:"“坪坝”的“坝”应该读？",o:["bà","bèi","pā"],a:0},
 {q:"《铺满金色巴掌的水泥道》里，“金色的巴掌”指的是？",o:["梧桐树的落叶","小朋友的手掌","秋天的阳光"],a:0},
 {q:"《秋天的雨》开头说：秋天的雨，是一把——",o:["钥匙","扇子","伞"],a:0},
 {q:"《听听，秋的声音》是一篇什么？",o:["现代诗","记叙文","说明文"],a:0},
 {q:"《总也倒不了的老屋》里，老屋一直不倒，是因为？",o:["总有小动物需要帮助","它盖得很结实","没有刮大风"],a:0},
 {q:"《在牛肚子里旅行》讲的是哪两只小动物？",o:["蟋蟀红头和青头","蚂蚁和蜜蜂","小鸡和小鸭"],a:0},
 {q:"《一块奶酪》里，蚂蚁队长最后怎么处理那一角奶酪？",o:["让最小的蚂蚁吃了","自己吃了","扔掉了"],a:0},
 {q:"《宝葫芦的秘密》的作者是？",o:["张天翼","叶圣陶","老舍"],a:0},
 {q:"《搭船的鸟》里，“我”看到的那只鸟是？",o:["翠鸟","麻雀","燕子"],a:0},
 {q:"《金色的草地》里，草地为什么会变颜色？",o:["蒲公英的花会张开合拢","阳光照的角度不同","有人染的色"],a:0},
 {q:"《富饶的西沙群岛》主要写的是哪里？",o:["我国南海的岛屿","东北的森林","西部的沙漠"],a:0},
 {q:"《海滨小城》里，小城最美的是什么？",o:["公园和街道很干净整洁","高楼大厦","热闹的市场"],a:0},
 {q:"《美丽的小兴安岭》里，小兴安岭被称为什么？",o:["绿色的海洋","花的世界","水的故乡"],a:0},
 {q:"《大自然的声音》里，谁是大自然的音乐家？",o:["风、水、动物","老师和同学","乐队"],a:0},
 {q:"《父亲、树林和鸟》里，父亲最喜欢的是？",o:["树林和唱歌的鸟","打猎","种树"],a:0},
 {q:"《司马光》是一篇什么？",o:["文言文","现代诗","书信"],a:0},
 {q:"《司马光》里，司马光用什么救出了掉进缸里的孩子？",o:["用石头砸破缸","叫大人来","用绳子拉"],a:0},
 {q:"《掌声》这篇课文告诉我们？",o:["要给别人鼓励和爱","要好好学习","要遵守纪律"],a:0},
 {q:"《灰雀》里的那个小男孩最后怎么做了？",o:["把灰雀放回来了","养起来了","送给了列宁"],a:0},
 {q:"《手术台就是阵地》写的是哪位医生？",o:["白求恩","李时珍","华佗"],a:0},
 {q:"《我们奇妙的世界》属于哪个单元的主题？",o:["观察与发现","童话故事","历史人物"],a:0},
 {q:"“摇头晃脑”的“晃”在这里读？",o:["huàng","huǎng","huāng"],a:0},
 {q:"“兴致勃勃”的“兴”读？",o:["xìng","xīng","xíng"],a:0},
 {q:"下面哪个词形容水面很平静？",o:["水平如镜","波涛汹涌","惊涛拍岸"],a:0},
 {q:"“绚丽多彩”一般用来形容？",o:["颜色美丽丰富","声音很响","动作很快"],a:0},
 {q:"《望天门山》是谁写的？",o:["李白","杜甫","王维"],a:0},
 {q:"《山行》里“停车坐爱枫林晚”的“坐”意思是？",o:["因为","坐下","座位"],a:0},
 {q:"《赠刘景文》里说：一年好景君须记，最是——",o:["橙黄橘绿时","春暖花开时","大雪纷飞时"],a:0},
 {q:"《夜书所见》里，“萧萧梧叶送寒声”写的是哪个季节？",o:["秋天","春天","夏天"],a:0}
]},
quran:{title:"古兰经 · 短章与常识",items:[
 {q:"「بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ」意思是？",o:["奉至仁至慈的真主之名","一切赞颂全归真主","愿你平安"],a:0},
 {q:"《开端章》(الفاتحة) 一共有几节？",o:["7节","5节","10节"],a:0},
 {q:"「قُلْ هُوَ اللَّهُ أَحَدٌ」出自哪一章？",o:["忠诚章 الإخلاص","黎明章 الفلق","世人章 الناس"],a:0},
 {q:"「الْحَمْدُ لِلَّهِ رَبِّ الْعَالَمِينَ」的意思是？",o:["一切赞颂全归真主，众世界的主","至仁至慈的主","报应日的主"],a:0},
 {q:"每天穆斯林要礼几次拜？",o:["5次","3次","7次"],a:0},
 {q:"《地震章》(الزلزلة) 说：做了微尘之重的善事会怎样？",o:["他将看见它","它会消失","没有说"],a:0},
 {q:"古兰经一共有多少章？",o:["114章","100章","120章"],a:0},
 {q:"「إِنَّ مَعَ الْعُسْرِ يُسْرًا」意思是？",o:["困难的确伴随着容易","忍耐是美好的","真主是至知的"],a:0},
 {q:"斋月是伊斯兰历的第几个月？",o:["第9个月","第1个月","第12个月"],a:0},
 {q:"「السلام عليكم」是什么意思？",o:["愿你平安","感谢真主","如蒙主意"],a:0}
]},
english:{title:"English words",items:[
 {q:"apple",o:["苹果","香蕉","橘子"],a:0},
 {q:"school",o:["学校","医院","公园"],a:0},
 {q:"friend",o:["朋友","老师","邻居"],a:0},
 {q:"family",o:["家人","房子","朋友"],a:0},
 {q:"homework",o:["作业","游戏","假期"],a:0},
 {q:"tomorrow",o:["明天","昨天","今天"],a:0},
 {q:"beautiful",o:["美丽的","难过的","快的"],a:0},
 {q:"remember",o:["记得","忘记","跑步"],a:0},
 {q:"together",o:["一起","单独","很少"],a:0},
 {q:"proud",o:["骄傲的","害怕的","饿的"],a:0},
 {q:"kitchen",o:["厨房","卧室","花园"],a:0},
 {q:"airport",o:["机场","车站","码头"],a:0},
 {q:"delicious",o:["好吃的","难看的","吵闹的"],a:0},
 {q:"practice",o:["练习","休息","旅行"],a:0}
]}};

const REWARDS=[
 ["一集动画片",20],["和爸爸下一盘棋",25],["选今天的晚饭",30],
 ["晚睡半小时",40],["买一本新书",60],["周末去公园",80],["一个小玩具",120]
];
/* 真盲盒：内容由爸爸设置（长按标题进管理），孩子看不到清单 */
const DEFAULT_WISHES=["和爸爸单独出去吃一顿饭","今晚全家看什么电影你说了算","免做一次家务","和妈妈一起做蛋糕",
 "多玩 20 分钟手机","一次去游乐场的机会","挑一样自己喜欢的零食","让爸爸讲一个他小时候的故事",
 "全家陪你打一局游戏","下周挑一天当「博远说了算」日","再抽一次！","一个爸爸的拥抱和一句悄悄话"];
function getWishes(){try{const w=JSON.parse(localStorage.getItem("wishPool")||"null");return (w&&w.length)?w:DEFAULT_WISHES}catch(e){return DEFAULT_WISHES}}

/* ================= 数据 ================= */
const K="boyuanStar";
let D={stars:0,total:0,today:"",todayStars:0,streak:0,last:"",phone:0,wishes:[],done:{}};
try{Object.assign(D,JSON.parse(localStorage.getItem(K)||"{}"))}catch(e){}
const today=new Date().toISOString().slice(0,10);
if(D.today!==today){D.today=today;D.todayStars=0}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function toast(t){const e=document.getElementById("toast");e.textContent=t;e.classList.add("on");setTimeout(()=>e.classList.remove("on"),1500)}
function addStar(n){
  D.stars+=n;D.total+=n;D.todayStars+=n;
  const y=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(D.last!==today){D.streak=(D.last===y)?D.streak+1:1;D.last=today}
  save();render();
}
function render(){
  document.getElementById("starCount").textContent=D.stars;
  document.getElementById("todayStars").textContent=D.todayStars;
  document.getElementById("streak").textContent=D.streak;
  document.getElementById("phoneMin").textContent=D.phone;
  const sb=document.getElementById("sbar");sb.innerHTML="";
  for(let i=0;i<7;i++){const d=document.createElement("i");if(i<Math.min(7,D.streak))d.className="on";sb.appendChild(d)}
  const box=document.getElementById("rewards");box.innerHTML="";
  REWARDS.forEach(([name,cost])=>{
    const d=document.createElement("div");d.className="reward";
    d.innerHTML='<div><div class="n">'+name+'</div><div class="c">'+cost+' ⭐</div></div>';
    const b=document.createElement("button");b.textContent="换";b.disabled=D.stars<cost;
    b.onclick=()=>{if(D.stars<cost)return;D.stars-=cost;save();render();
      toast("换到了："+name+" 🎉 记得告诉爸爸")};
    d.appendChild(b);box.appendChild(d);
  });
  const wl=document.getElementById("wishLog");
  wl.textContent=D.wishes.length?("你已经抽中过 "+D.wishes.length+" 个愿望啦"):"";
}

/* ================= 出题 ================= */
let cur=null,idx=0,score=0,list=[];
document.querySelectorAll("[data-sub]").forEach(b=>{
  b.onclick=()=>{
    cur=b.dataset.sub;const bank=BANK[cur];
    list=[...bank.items].sort(()=>Math.random()-.5).slice(0,10);
    idx=0;score=0;
    document.getElementById("quizCard").style.display="block";
    document.getElementById("quizTitle").textContent=bank.title;
    ask();
    document.getElementById("quizCard").scrollIntoView({behavior:"smooth",block:"nearest"});
  };
});
function ask(){
  const qb=document.getElementById("q"),ob=document.getElementById("opts");
  if(idx>=list.length){
    const got=score;
    qb.innerHTML='<span class="big">🌟</span>答对 '+got+' / '+list.length+'<br>得到 '+got+' 颗星星！';
    ob.innerHTML='<button class="main" onclick="location.reload()">再来一组</button>';
    document.getElementById("prog").textContent="";
    addStar(got);
    return;
  }
  const it=list[idx];
  qb.innerHTML=(cur==="english")?'<span class="big">'+it.q+'</span>这个词是什么意思？':it.q;
  ob.innerHTML="";
  const order=it.o.map((t,i)=>[t,i]).sort(()=>Math.random()-.5);
  order.forEach(([text,i])=>{
    const b=document.createElement("button");b.className="opt";b.textContent=text;
    b.onclick=()=>{
      if(i===it.a){b.classList.add("right");score++;toast("答对了 +1 ⭐");if(cur==="english")speakRoster(it.q)}
      else{b.classList.add("wrong");
        [...ob.children].forEach((c,j)=>{if(order[j][1]===it.a)c.classList.add("right")});
        toast("再看一眼正确答案")}
      [...ob.children].forEach(c=>c.onclick=null);
      setTimeout(()=>{idx++;ask()},1100);
    };
    ob.appendChild(b);
  });
  document.getElementById("prog").textContent="第 "+(idx+1)+" / "+list.length+" 题";
  speakRoster(it.q);
}

function b64(buf){var s="",b=new Uint8Array(buf);for(var i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}

async function tGo(){
