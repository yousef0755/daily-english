<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#070b0d">
<title>Five Minutes</title>
<style>
:root{
  --bg:#070b0d; --bg2:#0c1317; --card:#101a1f; --line:rgba(255,255,255,.08);
  --ink:#eef4f2; --dim:#8b9a97; --gold:#d9b26a; --gold-soft:#f0dcae;
  --green:#3f9f7f;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  --sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --ar:"Geeza Pro","Al Bayan","Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{
  background:var(--bg); color:var(--ink); font-family:var(--sans);
  min-height:100vh; padding:0 0 60px;
  background-image:
    radial-gradient(90% 60% at 78% -8%, rgba(217,178,106,.10), transparent 62%),
    radial-gradient(70% 50% at 8% 4%, rgba(63,159,127,.09), transparent 60%);
  background-attachment:fixed;
}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}

/* 顶：一条，不占地方 */
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 12px;gap:12px}
.brand{font-family:var(--serif);font-size:18px;letter-spacing:.4px}
.brand small{display:block;font-family:var(--sans);font-size:9.5px;letter-spacing:1.8px;
  color:var(--dim);text-transform:uppercase;margin-top:3px}
.streak{
  flex:0 0 auto;border:1px solid rgba(217,178,106,.30);border-radius:999px;
  padding:7px 13px;background:rgba(217,178,106,.08);color:var(--gold-soft);
  font-size:12px;font-weight:650;white-space:nowrap
}

/* 今天这一件 */
.today{
  border:1px solid var(--line);border-radius:20px;padding:18px 18px 16px;
  background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.015));
  box-shadow:0 20px 50px rgba(0,0,0,.35)
}
.kicker{font-size:9.5px;letter-spacing:2.2px;text-transform:uppercase;color:var(--gold);margin-bottom:8px}
.today h1{font-family:var(--serif);font-weight:400;font-size:23px;line-height:1.3}
.today .sub{margin-top:6px;font-size:12.5px;line-height:1.65;color:var(--dim)}
.meta{margin-top:12px;font-size:11px;color:var(--dim);display:flex;gap:14px;flex-wrap:wrap}
.meta b{color:var(--gold-soft);font-weight:600}

/* 一行一句 */
.lines{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.line{
  border:1px solid var(--line);border-radius:15px;background:var(--card);
  padding:13px 14px;display:flex;gap:11px;align-items:flex-start;cursor:pointer;
  transition:border-color .16s,background .16s
}
.line.open{border-color:rgba(217,178,106,.34);background:#121e24}
.n{flex:0 0 auto;width:20px;height:20px;border-radius:50%;margin-top:3px;
  background:rgba(217,178,106,.13);color:var(--gold);font-size:10.5px;font-weight:700;
  display:grid;place-items:center;font-variant-numeric:tabular-nums}
.body{flex:1;min-width:0}
.ar{font-family:var(--ar);font-size:21px;line-height:2.05;direction:rtl;text-align:right}
.en-main{font-size:16px;line-height:1.55;font-family:var(--serif)}
.tr{margin-top:7px;font-size:13px;line-height:1.6;color:var(--dim)}
.tr[dir="rtl"]{font-family:var(--ar);font-size:16px;line-height:1.9;text-align:right}
.note{margin-top:6px;font-size:11.5px;line-height:1.6;color:#7d8c89}
.play{flex:0 0 auto;width:32px;height:32px;border-radius:10px;margin-top:1px;
  border:1px solid rgba(217,178,106,.32);background:rgba(217,178,106,.09);
  color:var(--gold-soft);display:grid;place-items:center;font-size:11px;cursor:pointer}
.play:active{background:rgba(217,178,106,.2)}
.tafsir{margin-top:9px;padding:9px 11px;border-right:2px solid rgba(217,178,106,.45);
  background:rgba(217,178,106,.05);border-radius:8px;
  font-family:var(--ar);font-size:14.5px;line-height:1.95;color:#c8d4d1;direction:rtl;text-align:right}
/* 《الميسر》是分段串讲，一条注释管好几节。不写清楚管到哪儿，
   他翻到没注释的那几节会以为页面漏了。 */
.tspan{margin-top:9px;display:flex;align-items:center;gap:7px;
  font-size:10.5px;letter-spacing:.3px;color:#8b9a97}
.tspan::before{content:"";flex:0 0 13px;height:1px;background:rgba(217,178,106,.5)}
.tspan + .tafsir{margin-top:5px}
.bg{margin-top:12px;padding:11px 13px;border-radius:12px;border:1px solid rgba(217,178,106,.22);
  background:rgba(217,178,106,.06);font-size:12.5px;line-height:1.75;color:#cfd9d6}
.bg b{color:var(--gold-soft)}
.tap-hint{margin:10px 2px 0;font-size:11px;color:var(--dim)}
/* 点了没声音的时候，得有个地方把话说出来 */
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom));
  transform:translateX(-50%) translateY(14px);width:min(520px,calc(100% - 24px));z-index:30;
  padding:12px 14px;border-radius:13px;border:1px solid rgba(217,178,106,.34);
  background:rgba(16,26,31,.97);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
  color:#e6ece9;font-size:12.5px;line-height:1.7;box-shadow:0 16px 42px rgba(0,0,0,.55);
  opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* 过关 */
.done{
  margin-top:16px;width:100%;border:0;border-radius:15px;padding:15px;
  background:linear-gradient(135deg,#c9a25c,#e6cf9b);color:#20170a;
  font-family:var(--sans);font-size:15px;font-weight:700;cursor:pointer;
  box-shadow:0 12px 30px rgba(201,162,92,.22)}
.done:disabled{background:rgba(255,255,255,.06);color:var(--dim);box-shadow:none}

/* 四条轨道，收在下面 */
.tracks{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.tracks h2{font-size:9.5px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);
  font-weight:600;margin-bottom:11px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.chip{
  border:1px solid var(--line);background:rgba(255,255,255,.04);color:var(--ink);
  border-radius:999px;padding:9px 15px;font-size:13px;cursor:pointer;opacity:.78
}
.chip:hover{opacity:1}
.chip.on{background:var(--gold);color:#20170a;border-color:transparent;opacity:1;font-weight:650}
.chapter-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.ch{border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--dim);
  border-radius:9px;padding:5px 9px;font-size:12px;cursor:pointer;font-variant-numeric:tabular-nums}
.ch.on{background:rgba(217,178,106,.16);color:var(--gold-soft);border-color:rgba(217,178,106,.3)}
footer{margin-top:24px;text-align:center;font-size:10.5px;color:#5f6d6a;line-height:1.8}

/* 返回一家人：跟 arabic/kid/mie/xiya/classic 一个做法（药丸 + ←文案 + sticky 跟着滚），
   颜色按本页深空调走 —— 沿用 .streak 那组金色，不从浅色页搬样式过来。
   min-height:44px 是手指点得到的最小尺寸。纯 HTML+CSS。 */
.famlink{position:sticky;top:8px;z-index:60;
  display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  margin:10px 0 0;padding:9px 16px;
  border:1px solid rgba(217,178,106,.30);border-radius:999px;
  background:rgba(217,178,106,.08);color:var(--gold-soft);
  font-size:13px;font-weight:650;text-decoration:none;white-space:nowrap}
.famlink:active{background:rgba(217,178,106,.16)}
@supports(padding:max(0px)){ .famlink{top:max(8px, env(safe-area-inset-top))} }
</style>
</head>
<body>
<div class="wrap">

  <a class="famlink" href="./family.html" aria-label="返回一家人今天">← 返回一家人</a>

  <div class="top">
    <div class="brand">Five Minutes<small>one thing a day</small></div>
    <div class="streak" id="streak">🔥 Day 1 · starts today</div>
  </div>

  <section class="today">
    <div class="kicker" id="kicker">Today</div>
    <h1 id="title">…</h1>
    <p class="sub" id="sub"></p>
    <div class="meta" id="meta"></div>
  </section>

  <div class="bg" id="bg" style="display:none"></div>
  <div class="tap-hint" id="hint">Tap ▶ to hear it. Translations are always shown.</div>
  <div class="lines" id="lines"></div>

  <button class="done" id="done">Done for today</button>

  <div class="tracks">
    <h2>Tracks</h2>
    <div class="row" id="tracks"></div>
    <div class="chapter-row" id="chapters"></div>
  </div>

  <footer>
    Quran recitation: Husary (Mu‘allim) · text and English from quran-uthmani / Sahih International<br>
    <span id="stamp"></span>
  </footer>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ── 老板 2026-08-19 定的四条轨道 ──────────────────────────────
   1 古兰背诵：从第 92 章 الليل「وَٱلَّيْلِ إِذَا يَغْشَىٰ」往前背
   2 阿拉伯语会议 · 带英语翻译
   3 英语演讲 · 带阿拉伯语翻译
   4 阿拉伯语诗歌 · 带英语诗歌翻译
   原话：「不要管我之前的设计，你重新帮我设计」
   界面英文照他 8-15 的口径；经文一律真人诵读，不用合成音。 */

const TRACKS = [
  {id:"quran",  label:"Quran",   kicker:"Today · Quran",   dir:"rtl"},
  {id:"meeting",label:"Meeting", kicker:"Today · Meeting Arabic", dir:"rtl"},
  {id:"speech", label:"Speech",  kicker:"Today · English speaking", dir:"ltr"},
  {id:"poetry", label:"Poetry",  kicker:"Today · Arabic poetry", dir:"rtl"}
];

let DATA = {quran:[], meeting:[], speech:[], poetry:[]};
let VOICE = {};           /* 文本 → mp3 */
let cur = {track:"quran", idx:0};

const $ = id => document.getElementById(id);
const store = {
  get(k){ try{ return localStorage.getItem(k) }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(k,v) }catch(e){} }
};

/* 连续天数沿用旧站那把钥匙，换页不清零 */
const KEY = "fiveMinutes";
let state = {streak:0,last:"",done:{}};
try{ state = Object.assign(state, JSON.parse(store.get(KEY)||"{}")) }catch(e){}

function dubaiToday(){
  const d = new Date(Date.now() + 4*3600*1000);   /* 本机时区＝迪拜，仍按迪拜日界线算 */
  return d.toISOString().slice(0,10);
}
function renderStreak(){
  const n = state.streak|0;
  $("streak").textContent = n>0
    ? "🔥 Day "+n+(state.last===dubaiToday()?" · today is lit":"")
    : "🔥 Day 1 · starts today";
}

/* 底下这条横幅：点了没声音的时候，得让他看见为什么，别一声不吭。 */
let toastTimer = null;
function toast(msg){
  const el = $("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>el.classList.remove("show"), 6000);
}
function voiceFor(lang){
  let vs = [];
  try{ vs = speechSynthesis.getVoices() || [] }catch(e){}
  const base = lang.split("-")[0].toLowerCase();
  return vs.find(v => ((v.lang||"").toLowerCase().replace("_","-").split("-")[0]) === base) || null;
}
function noVoiceMsg(ar){
  return ar
    ? "这句还没有真人录音，这台设备里也没有阿拉伯语发音包，所以放不出声。"
      + "装一个再点：设置 → 辅助功能 → 朗读内容 → 声音 → 阿拉伯语。"
    : "这句还没有真人录音，这台设备的朗读也没响应，所以放不出声。";
}
/* 古兰和会议两轨每句都有真人音，走上面 playBuf。
   诗歌和演讲还没录，只能退回系统合成音——而很多 iPhone 根本没装阿语音色：
   speechSynthesis.speak() 不报错、也不出声，他点了以为按钮坏了。
   所以这里三道都堵上：没音色先说、报错要说、说了半天没开口也要说。 */
function speak(text){
  const f = VOICE[text];
  if(f){ playBuf("media/kidaudio/"+f); return; }
  const ar = /[؀-ۿ]/.test(text);
  if(!("speechSynthesis" in window) || typeof SpeechSynthesisUtterance === "undefined"){
    toast(noVoiceMsg(ar)); return;
  }
  const lang = ar ? "ar-SA" : "en-US";
  const v = voiceFor(lang);
  let loaded = 0;
  try{ loaded = (speechSynthesis.getVoices()||[]).length }catch(e){}
  /* 音色表还没加载出来（loaded==0）的时候不敢下结论，先试着念，交给下面的超时兜 */
  if(loaded && !v){ toast(noVoiceMsg(ar)); return; }
  try{
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang; if(v) u.voice = v;
    u.rate = .88;
    let started = false;
    u.onstart = () => { started = true };
    u.onerror = () => { if(!started) toast(noVoiceMsg(ar)) };
    speechSynthesis.speak(u);
    setTimeout(()=>{ if(!started) toast(noVoiceMsg(ar)) }, 1800);
  }catch(e){ toast(noVoiceMsg(ar)); }
}
/* Chrome 第一次 getVoices() 常常是空的，先叫一声让它去加载 */
try{ speechSynthesis.getVoices() }catch(e){}
/* iPhone 侧边静音拨杆会掐掉 <audio>，但管不了 Web Audio——这条坑旧站踩过，照搬 */
let actx=null, asrc=null, cache={};
function playBuf(url){
  try{
    if(!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==="suspended") actx.resume();
  }catch(e){ const a=new Audio(url); a.play().catch(()=>{}); return }
  try{ if(asrc) asrc.stop() }catch(e){}
  const go = buf => { const s=actx.createBufferSource(); s.buffer=buf;
    s.connect(actx.destination); s.start(0); asrc=s; };
  if(cache[url]) return go(cache[url]);
  fetch(url).then(r=>r.arrayBuffer()).then(b=>actx.decodeAudioData(b))
    .then(buf=>{ cache[url]=buf; go(buf) })
    .catch(()=>{ const a=new Audio(url); a.play().catch(()=>{}) });
}

/* 背诵是往前走的，不是每天随机换一章：
   老板 8-19 说「从 وَٱلَّيْلِ إِذَا يَغْشَىٰ 往前背」——那就从 92 开始，
   他按「Done」才前进一章，中途换章也记得住。别的轨道才按天轮。 */
function todayIndex(list){
  if(!list.length) return 0;
  if(cur.track==="quran"){
    const at = parseInt(store.get("quranAt")||"0",10);
    return Math.max(0, Math.min(at, list.length-1));
  }
  const day = Math.floor((Date.now()+4*3600*1000)/86400000);
  return day % list.length;
}

function render(){
  const t = TRACKS.find(x=>x.id===cur.track);
  const list = DATA[cur.track] || [];
  if(!list.length){
    $("title").textContent = "Loading…"; $("lines").innerHTML=""; return;
  }
  const item = list[Math.min(cur.idx, list.length-1)];
  $("kicker").textContent = t.kicker;
  $("title").textContent = item.title || "";
  $("sub").textContent = item.sub || "";
  $("meta").innerHTML = (item.meta||[]).map(m=>"<span>"+m+"</span>").join("");
  const bgBox = $("bg");
  if(item.bg){ bgBox.style.display="block"; bgBox.innerHTML=item.bg } else bgBox.style.display="none";

  const box = $("lines"); box.innerHTML="";
  (item.lines||[]).forEach((L,i)=>{
    const el = document.createElement("div"); el.className="line";
    const isAr = t.dir==="rtl";
    const main = isAr ? `<div class="ar">${L.a}</div>` : `<div class="en-main">${L.a}</div>`;
    const trDir = isAr ? "" : ' dir="rtl"';
    el.innerHTML =
      `<div class="n">${String(i+1).padStart(2,"0")}</div>
       <div class="body">${main}
         <div class="tr"${trDir}>${L.b||""}</div>
         ${L.note?`<div class="note">${L.note}</div>`:""}
         ${L.span?`<div class="tspan">${L.span}</div>`:""}
         ${L.tafsir?`<div class="tafsir">${L.tafsir}</div>`:""}
       </div>
       <button class="play" aria-label="listen">▶</button>`;
    el.addEventListener("click", e=>{ if(e.target.closest(".play")) speak(L.a); });
    box.appendChild(el);
  });

  const dk = cur.track+"|"+cur.idx+"|"+dubaiToday();
  const done = !!state.done[dk];
  $("done").disabled = done;
  $("done").textContent = done ? "Done today ✓" : "Done for today";
  renderChapters(list);
}

function renderTracks(){
  $("tracks").innerHTML = "";
  TRACKS.forEach(t=>{
    const b=document.createElement("div");
    b.className="chip"+(t.id===cur.track?" on":"");
    b.textContent=t.label;
    b.onclick=()=>{ cur.track=t.id; cur.idx=todayIndex(DATA[t.id]||[]); renderTracks(); render();
      window.scrollTo({top:0,behavior:"smooth"}) };
    $("tracks").appendChild(b);
  });
}
function renderChapters(list){
  const box=$("chapters"); box.innerHTML="";
  if(list.length<2) return;
  list.forEach((it,i)=>{
    const b=document.createElement("div");
    b.className="ch"+(i===cur.idx?" on":"");
    b.textContent=it.short||String(i+1);
    b.onclick=()=>{ cur.idx=i; if(cur.track==="quran") store.set("quranAt",String(i)); render() };
    box.appendChild(b);
  });
}

$("done").addEventListener("click",()=>{
  const today=dubaiToday();
  state.done[cur.track+"|"+cur.idx+"|"+today]=1;
  if(state.last!==today){
    const y=new Date(Date.now()+4*3600*1000-86400000).toISOString().slice(0,10);
    state.streak = (state.last===y) ? (state.streak|0)+1 : 1;
    state.last = today;
  }
  store.set(KEY, JSON.stringify(state));
  try{ localStorage.setItem("babaDone", dubaiToday()) }catch(e){}
  famPing(1);
  if(cur.track==="quran"){           /* 背完这一章，明天从下一章接着走 */
    const next = Math.min(cur.idx+1, (DATA.quran||[]).length-1);
    store.set("quranAt", String(next));
  }
  renderStreak(); render();
});

/* 上家庭榜：他做完，家里人板上要看得见。本机预览不上报，免得调试就替他打了卡。 */
const FAM_API = "https://su-family.yousef-abud.workers.dev";
function famPing(done){
  if(/^(localhost|127\.|192\.168\.)/.test(location.hostname)) return;
  fetch(FAM_API+"/fam/ping",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({who:"baba",done:done|0,total:1,started:true})}).catch(()=>{});
}
famPing(state.last===dubaiToday()?1:0);

Promise.all([
  fetch("data/five-content.json?v="+Date.now()).then(r=>r.json()).catch(()=>({})),
  fetch("media/kidaudio/index.json").then(r=>r.json()).catch(()=>({}))
]).then(([content, voice])=>{
  DATA = Object.assign(DATA, content);
  VOICE = voice||{};
  cur.idx = todayIndex(DATA[cur.track]||[]);
  renderTracks(); renderStreak(); render();
  $("stamp").textContent = "content build " + (content.__built||"—");
});
</script>
<style id="prismlayer">
/* 棱镜光幕试穿版：底换光幕，卡改玻璃，其余全是原站 */
body{background:transparent!important}
#prismbg{position:fixed;inset:0;width:100%;height:100%;z-index:-1;display:block}
main,header,section,.card,[class*=card]{position:relative}
.card,[class*="card"],[class*="verse"],[class*="line"],[class*="row"]{
  background:rgba(10,15,24,.58)!important;
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border:1px solid rgba(216,179,102,.16)!important;
}
</style>
<canvas id="prismbg"></canvas>
<script>
(function(){
const cv=document.getElementById("prismbg"),ctx=cv.getContext("2d");
let W,H,dpr;
function fit(){dpr=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
fit();addEventListener("resize",fit);
/* 深色系光谱：配他的金色卡——蓝夜→靛→紫→暗青→古铜 */
const STOPS=[[220,34,42],[235,30,40],[258,28,44],[248,32,41],[266,26,44],[240,28,40],[40,36,46],[36,40,42]];
function palette(t){const n=STOPS.length-1,x=t*n,i=Math.min(n-1,Math.floor(x)),f=x-i;
  const a=STOPS[i],b=STOPS[i+1];let dh=b[0]-a[0];if(dh>180)dh-=360;if(dh<-180)dh+=360;
  return [a[0]+dh*f,a[1]+(b[1]-a[1])*f,a[2]+(b[2]-a[2])*f];}
let mx=innerWidth*.5,my=innerHeight*.35,tx=mx,ty=my;
/* 星辰大海：常驻星 + 鼠标搅起的星尘 */
const stars=[],dust=[];
function seedStars(){
  stars.length=0;
  const n=Math.round(W*H/4200);
  for(let i=0;i<n;i++)stars.push({x:Math.random()*W,y:Math.random()*H,r:.5+Math.random()*1.3,
    ph:Math.random()*7,sp:.4+Math.random()*1.2,drift:.02+Math.random()*.05});
}
seedStars();addEventListener("resize",seedStars);
let lastDust=0;
function stirDust(x,y){
  const now=performance.now();
  if(now-lastDust<40)return;   /* 节流 */
  lastDust=now;
  for(let i=0;i<3;i++){
    const a=Math.random()*Math.PI*2,v=.3+Math.random()*1.1;
    dust.push({x:x+(Math.random()*18-9),y:y+(Math.random()*18-9),
      vx:Math.cos(a)*v,vy:Math.sin(a)*v-.15,life:1,r:.6+Math.random()*1.4});
    if(dust.length>140)dust.shift();
  }
}
/* 流星：右上进，左下出，拖尾渐隐 */
const meteors=[];
function spawnMeteor(){
  const sx=W*(.3+Math.random()*.8), sy=-40-Math.random()*H*.2;
  const ang=Math.PI*(0.72+Math.random()*0.10);   /* 偏左下 */
  const sp=(H+W)*(.0038+Math.random()*.0024);
  meteors.push({x:sx,y:sy,vx:Math.cos(ang)*sp,vy:Math.sin(ang)*sp,life:1,len:90+Math.random()*110});
}
addEventListener("pointermove",e=>{tx=e.clientX;ty=e.clientY;stirDust(e.clientX,e.clientY)},{passive:true});
addEventListener("touchmove",e=>{const t=e.touches[0];if(t){tx=t.clientX;ty=t.clientY;stirDust(t.clientX,t.clientY)}},{passive:true});
addEventListener("click",e=>{
  const b=e.target.closest("button");
  if(b&&/▶|play/i.test(b.textContent+b.className)){
    const r=b.getBoundingClientRect();tx=r.left+r.width/2;ty=r.top+r.height/2;
  }
},true);
function draw(ts){
  const t=ts/1000;
  mx+=(tx-mx)*.08;my+=(ty-my)*.08;
  /* 夜空底：深蓝黑渐变 */
  const bg=ctx.createLinearGradient(0,0,0,H);
  bg.addColorStop(0,"#03060d");
  bg.addColorStop(.45,"#071021");
  bg.addColorStop(1,"#050a16");
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  /* 两团星云缓慢呼吸，跟着光标轻轻挪 */
  const nx1=W*.72+Math.sin(t*.045)*W*.05+(mx-W/2)*.05, ny1=H*.24+Math.cos(t*.05)*H*.03;
  const g1=ctx.createRadialGradient(nx1,ny1,0,nx1,ny1,W*.55);
  g1.addColorStop(0,"rgba(80,125,200,.13)");g1.addColorStop(.5,"rgba(80,125,200,.05)");g1.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g1;ctx.fillRect(0,0,W,H);
  const nx2=W*.2+Math.cos(t*.04)*W*.05+(mx-W/2)*.03, ny2=H*.72+Math.sin(t*.06)*H*.03;
  const g2=ctx.createRadialGradient(nx2,ny2,0,nx2,ny2,W*.5);
  g2.addColorStop(0,"rgba(216,179,102,.09)");g2.addColorStop(.5,"rgba(150,110,200,.05)");g2.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g2;ctx.fillRect(0,0,W,H);
  /* 星辰层：常驻星闪烁，靠近光标的更亮 */
  for(const s of stars){
    s.x+=s.drift; if(s.x>W+4)s.x=-4;
    const tw=(Math.sin(t*s.sp+s.ph)+1)/2;
    const d=Math.hypot(s.x-mx,s.y-my);
    const near=Math.exp(-(d*d)/(2*160*160));
    const a=.16+tw*.34+near*.5;
    ctx.fillStyle=`rgba(255,255,255,${Math.min(.9,a)})`;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r+near*.8,0,7);ctx.fill();
  }
  /* 星尘：鼠标搅起来的 */
  for(let k=dust.length-1;k>=0;k--){
    const p=dust[k];
    p.x+=p.vx;p.y+=p.vy;p.vy-=.004;p.life-=.014;
    if(p.life<=0){dust.splice(k,1);continue}
    ctx.fillStyle=`rgba(255,250,235,${.7*p.life})`;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r*p.life+.3,0,7);ctx.fill();
  }
  /* 流星层 */
  if(Math.random()<0.022&&meteors.length<3)spawnMeteor();
  for(let k=meteors.length-1;k>=0;k--){
    const m=meteors[k];
    m.x+=m.vx;m.y+=m.vy;m.life-=0.006;
    if(m.life<=0||m.x<-200||m.y>H+200){meteors.splice(k,1);continue}
    const hx=m.x,hy=m.y,txl=m.x-m.vx*(m.len/Math.hypot(m.vx,m.vy)),tyl=m.y-m.vy*(m.len/Math.hypot(m.vx,m.vy));
    const mg=ctx.createLinearGradient(hx,hy,txl,tyl);
    mg.addColorStop(0,`rgba(255,255,255,${.85*m.life})`);
    mg.addColorStop(.4,`rgba(210,225,255,${.35*m.life})`);
    mg.addColorStop(1,"rgba(210,225,255,0)");
    ctx.strokeStyle=mg;ctx.lineWidth=2.8;ctx.lineCap="round";
    ctx.beginPath();ctx.moveTo(hx,hy);ctx.lineTo(txl,tyl);ctx.stroke();
    ctx.fillStyle=`rgba(255,255,255,${.9*m.life})`;
    ctx.beginPath();ctx.arc(hx,hy,2.4,0,7);ctx.fill();
  }
  const vg=ctx.createLinearGradient(0,0,0,H);
  vg.addColorStop(0,"rgba(8,10,18,.56)");
  vg.addColorStop(.30,"rgba(4,6,12,0)");
  vg.addColorStop(.72,"rgba(4,6,12,0)");
  vg.addColorStop(1,"rgba(8,10,18,.42)");
  ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);
})();
</script>
</body>
</html>
