<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="./kid-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一家人">
<title>一家人 · 今天</title>
<style>
:root{
  --bg:#07111f; --bg-2:#0b1929; --card:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.10); --ink:#eef3f8; --muted:#8fa3b8;
  --gold:#d9b45f; --mint:#7ed6b2; --dim:#3c4d61;
  --serif:'Songti SC','Iowan Old Style',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:
   radial-gradient(1100px 620px at 50% -12%, #12263f 0%, transparent 62%),
   var(--bg);
  color:var(--ink);line-height:1.7;
  font-family:-apple-system,'PingFang SC','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:30px 18px 44px}

header{text-align:center;margin-bottom:24px}
.eyebrow{font-size:.68rem;letter-spacing:.26em;color:var(--muted);margin:0 0 9px}
h1{font-family:var(--serif);font-weight:400;font-size:1.85rem;margin:0 0 12px;letter-spacing:.02em}
.today{display:inline-flex;align-items:baseline;gap:8px;
  border:1px solid var(--line);border-radius:99px;padding:6px 16px;
  background:var(--card);font-size:.83rem;color:var(--muted)}
.today b{font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums}

/* 一家人的那盏灯：全来了就整条亮起来 */
.lamp{height:3px;border-radius:99px;background:rgba(255,255,255,.07);
  margin:20px 0 22px;overflow:hidden}
.lamp i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--mint));
  transition:width 1s cubic-bezier(.2,.8,.3,1)}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:13px;padding:14px 15px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  transition:border-color .4s ease,opacity .4s ease}
li.away{opacity:.52}
li.here{border-color:rgba(217,180,95,.3)}
li.fin{border-color:rgba(126,214,178,.42)}

.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--dim)}
li.here .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(217,180,95,.14)}
li.fin .dot{background:var(--mint);box-shadow:0 0 0 4px rgba(126,214,178,.16)}

.who{flex:1;min-width:0}
.nm{font-size:1.02rem;font-weight:600;letter-spacing:.01em}
.wt{font-size:.76rem;color:var(--muted);margin-top:2px}
.wt em{font-style:normal;color:var(--mint)}

.right{text-align:right;flex:none}
.cnt{font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--muted)}
li.fin .cnt{color:var(--mint)}
li.here .cnt{color:var(--gold)}
.kp{font-size:.7rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.kp b{color:var(--ink);font-variant-numeric:tabular-nums}

.note{margin:26px 0 0;padding:15px 16px;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:16px;
  font-size:.83rem;color:var(--muted);line-height:1.85}
.note b{color:var(--gold)}
footer{margin-top:22px;text-align:center;font-size:.7rem;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

.tick{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.78rem;font-family:inherit;
  font-weight:600;cursor:pointer;white-space:nowrap}
.tick.on{border-color:rgba(126,214,178,.45);background:rgba(126,214,178,.14);color:var(--mint)}
.tick:disabled{opacity:.5}

a.who{text-decoration:none;color:inherit;display:block}
a.who:active .nm{opacity:.6}
.nm .go{font-style:normal;color:var(--gold);margin-left:6px;font-size:.95em;opacity:.75}

/* ── 猫跟着努力的人（老板 2026-08-15：努力的人和小猫咪在一起）── */
.cats{margin:4px 0 18px;text-align:center}
.cwrap{display:flex;justify-content:center;align-items:flex-end;gap:2px}
.fcat{width:74px;height:auto;overflow:visible;transition:opacity .5s ease,filter .5s ease}
.fcat .tail{transform-origin:152px 130px}
.fcat .earL{transform-origin:76px 60px}
.fcat .earR{transform-origin:124px 60px}
/* 首次数据回来前先安静等候；确认没人来后会切到 waiting 互动。 */
.fcat .open{opacity:0}
.fcat .shut{opacity:1}
.cats.asleep .fcat{opacity:.4;filter:saturate(.35)}
.cats.asleep .fcat{animation:fbreathe 4.6s ease-in-out infinite}
@keyframes fbreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 有人来：睁眼、耳朵动、尾巴甩 */
.cats.awake .fcat .open{opacity:1}
.cats.awake .fcat .shut{opacity:0}
.cats.awake .fcat .tail{animation:fflick 1.5s ease-in-out infinite}
.cats.awake #fcatS .earL{animation:fearL 2.7s ease-in-out infinite}
.cats.awake #fcatD .earR{animation:fearR 2.7s ease-in-out infinite}
@keyframes fflick{0%,100%{transform:rotate(0)}50%{transform:rotate(-15deg)}}
@keyframes fearL{0%,100%{transform:rotate(0)}50%{transform:rotate(-11deg)}}
@keyframes fearR{0%,100%{transform:rotate(0)}50%{transform:rotate(11deg)}}
.cline{margin:9px 0 0;font-size:.85rem;line-height:1.75;color:var(--muted)}
.cline b{color:var(--gold)}
.cats.awake .cline b{color:var(--mint)}
/* 谁身边有猫，行上带个爪印 */
.paw{display:inline-block;width:13px;height:13px;margin-left:7px;vertical-align:-1px;opacity:.9}
@media (prefers-reduced-motion:reduce){.fcat,.fcat *{animation:none !important}}

/* ── 没人来的时候两只自己玩（老板 2026-08-15）── */
.cats.waiting .fcat{opacity:1;filter:none}
.cats.waiting .fcat .open{opacity:1}
.cats.waiting .fcat .shut{opacity:0}
.cats.waiting .cwrap{cursor:pointer;touch-action:manipulation}
.cats.waiting .cwrap:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:18px}
/* 一号玩法：哆米去拨 Snowy 的尾巴，Snowy 把尾巴收走 */
.cats.waiting.p1 #fcatD{animation:lean 2.4s ease-in-out infinite}
.cats.waiting.p1 #fcatS .tail{animation:tuck 2.4s ease-in-out infinite}
@keyframes lean{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px) rotate(-3deg)}}
@keyframes tuck{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
/* 二号玩法：Snowy 伸懒腰，哆米看着 */
.cats.waiting.p2 #fcatS{animation:stretch 2.6s ease-in-out infinite}
.cats.waiting.p2 #fcatD .head{animation:look 2.6s ease-in-out infinite}
@keyframes stretch{0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.07) scaleY(.94)}}
@keyframes look{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
/* 三号玩法：两只一起望门口 */
.cats.waiting.p3 #fcatS .head,.cats.waiting.p3 #fcatD .head{animation:watch 3s ease-in-out infinite}
.cats.waiting.p3 .fcat .earL,.cats.waiting.p3 .fcat .earR{animation:perk 3s ease-in-out infinite}
@keyframes watch{0%,100%{transform:rotate(0)}45%,55%{transform:rotate(6deg)}}
@keyframes perk{0%,100%{transform:rotate(0)}45%,55%{transform:rotate(-13deg)}}
/* 四号玩法：哆米蹦一下 */
.cats.waiting.p4 #fcatD{animation:hop .7s ease-in-out infinite}
.cats.waiting.p4 #fcatS .tail{animation:fflick 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cats.waiting .cline{display:grid;gap:7px;width:min(100%,390px);margin:10px auto 0;text-align:left}
.cline .sp{display:block;width:max-content;max-width:88%;padding:7px 11px;
  border:1px solid var(--line);border-radius:14px 14px 14px 5px;
  background:rgba(255,255,255,.055);box-shadow:0 8px 22px rgba(0,0,0,.12);
  color:#c8d3de;font-size:.78rem;line-height:1.55}
.cline .sp b{display:block;color:var(--gold);font-size:.65rem;letter-spacing:.05em}
.cline .sp.d{justify-self:end;border-radius:14px 14px 5px 14px;background:rgba(217,180,95,.085)}
.cline .sp.d b{color:var(--mint)}
.tapcat{display:block;justify-self:center;color:var(--muted);font-size:.67rem;opacity:.76}

/* 醒着说话时也用气泡，并让两只有点小动作 */
.cats.awake .cline{display:grid;gap:7px;width:min(100%,390px);margin:10px auto 0;text-align:left}
.cats.awake .cwrap{cursor:pointer}
.cats.awake.talking #fcatS .tail{animation:fflick 1.6s ease-in-out infinite}
.cats.awake.talking #fcatD .earR{animation:fearR 2.9s ease-in-out infinite}

/* ── 猫的玩具（老板 2026-08-15：家里坚持越久，玩具攒得越多）──
   蝴蝶和已获得的玩具轮流出场，不把十几件东西同时堆在猫身上。 */
.toys{position:relative;height:0}
.toy{display:none;position:absolute;pointer-events:none;z-index:3}
.cats.waiting .toy{display:block}
.toy svg{display:block}
/* 蝴蝶是来做客的，不占玩具名额；即使刚开始也会飞来陪它们。 */
.toy.butterfly{left:-8%;top:-96px;width:26px;animation:flyby 13s linear infinite}
.toy.butterfly .w1{transform-origin:14px 12px;animation:flap .22s ease-in-out infinite alternate}
.toy.butterfly .w2{transform-origin:14px 12px;animation:flap2 .22s ease-in-out infinite alternate}
@keyframes flyby{0%{left:-10%;transform:translateY(0)}25%{transform:translateY(-16px)}
  50%{transform:translateY(8px)}75%{transform:translateY(-12px)}100%{left:106%;transform:translateY(0)}}
@keyframes flap{from{transform:rotateY(0)}to{transform:rotateY(72deg)}}
@keyframes flap2{from{transform:rotateY(0)}to{transform:rotateY(-72deg)}}
.toy.yarn{left:8%;top:-26px;width:22px;animation:roll 9s ease-in-out infinite}
@keyframes roll{0%,100%{left:6%;transform:rotate(0)}50%{left:74%;transform:rotate(540deg)}}
.toy.feather{right:6%;top:-84px;width:20px;transform-origin:10px 0;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
.toy.paper{left:70%;top:-22px;width:17px;animation:bounce 2.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
.toy.bell{left:26%;top:-20px;width:16px;animation:jingle 2.2s ease-in-out infinite}
@keyframes jingle{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
.toy.fish{right:20%;top:-30px;width:20px;animation:bob 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}
/* 后面坚持解锁的七件：小老鼠、猫薄荷、纸箱、隧道、磨爪架、软垫、猫爬架。 */
.toy.mouse{left:8%;top:-23px;width:24px;animation:scurry 4s ease-in-out infinite}
@keyframes scurry{0%,100%{left:6%;transform:scaleX(1)}49%{left:76%;transform:scaleX(1)}50%{left:76%;transform:scaleX(-1)}99%{left:6%;transform:scaleX(-1)}}
.toy.leaf{left:48%;top:-58px;width:21px;animation:leafFloat 3.2s ease-in-out infinite}
@keyframes leafFloat{0%,100%{transform:translateY(0) rotate(-14deg)}50%{transform:translateY(-10px) rotate(16deg)}}
.toy.box{left:40%;top:-30px;width:28px;animation:boxPeek 2.6s ease-in-out infinite}
@keyframes boxPeek{0%,100%{transform:scaleY(1)}50%{transform:scaleY(.92)}}
.toy.tunnel{left:34%;top:-27px;width:38px;animation:toyNudge 2.8s ease-in-out infinite}
.toy.scratcher{right:18%;top:-44px;width:24px;animation:toyNudge 2.5s ease-in-out infinite}
.toy.cushion{left:20%;top:-22px;width:32px;animation:toyNudge 3.1s ease-in-out infinite}
.toy.tower{right:8%;top:-57px;width:28px;animation:toyNudge 3.4s ease-in-out infinite}
@keyframes toyNudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.toyline{margin:7px 0 0;font-size:.72rem;color:var(--muted);opacity:.85}
.toyline b{color:var(--gold)}
.toyshelf{display:flex;gap:6px;width:min(100%,390px);margin:7px auto 0;padding:1px 1px 4px;
  overflow-x:auto;scrollbar-width:none}
.toyshelf::-webkit-scrollbar{display:none}
.toybadge{flex:0 0 auto;display:grid;place-items:center;width:32px;height:29px;border:1px solid rgba(217,180,95,.25);
  border-radius:9px;background:rgba(217,180,95,.07)}
.toybadge svg{display:block;width:18px;max-height:21px}
.toybadge.locked{border-color:var(--line);color:var(--muted);background:rgba(255,255,255,.025);font-size:.62rem;width:auto;padding:0 9px;white-space:nowrap;letter-spacing:.02em}
@media (prefers-reduced-motion:reduce){.toy,.toy *{animation:none !important}}

/* ── 本周搭子（老板 2026-08-15：一星期选一次搭子）──
   搭子的天数只算两个人都来的日子。你不来，我的也没了。 */
.pairs{margin:22px 0 0;padding:16px 16px 15px;background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:16px}
.pb-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pb-head span:first-child{font-size:.9rem;color:var(--gold);font-weight:700}
.pb-head span:last-child{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pb-tip{margin:0 0 12px;font-size:.8rem;line-height:1.75;color:var(--muted)}
.pr{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:8px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px}
.pr.strong{border-color:rgba(126,214,178,.4)}
.pr .rank{font-size:.78rem;color:var(--muted);width:16px;font-variant-numeric:tabular-nums}
.pr .nm2{flex:1;font-size:.95rem;font-weight:600}
.pr .nm2 i{font-style:normal;color:var(--muted);margin:0 5px;font-weight:400}
.pr .nm2 .off{opacity:.45}
.pr .dd{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap}
.pr.strong .dd{color:var(--mint)}
.pr .dd b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.pk{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pk .who2{flex-basis:100%;font-size:.76rem;color:var(--muted);margin-top:4px}
.pk button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
  border-radius:999px;padding:6px 12px;font-size:.8rem;font-family:inherit;cursor:pointer}
.pk button:active{background:rgba(255,255,255,.12)}

.pk .go2{border-color:rgba(217,180,95,.5);background:rgba(217,180,95,.14);color:var(--gold);font-weight:600}
.pk .cancel{opacity:.6}
.pk .wait{opacity:.55;font-size:.76rem}

/* ── 搭子重画（老板说原来那版难看）── */
.knot{padding:15px 14px 13px;margin-bottom:10px;border-radius:16px;
  background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.025));
  border:1px solid var(--line)}
.knot.strong{border-color:rgba(126,214,178,.42)}
.knot.empty{opacity:.62}
.knot-top{display:flex;align-items:center;gap:0}
.kn{flex:1;text-align:center;font-size:1rem;font-weight:600;letter-spacing:.02em;
  color:var(--muted);padding:7px 4px;border-radius:11px;background:rgba(255,255,255,.04)}
.kn.on{color:var(--ink);background:rgba(217,180,95,.13)}
.kn.ghost{color:var(--dim);font-weight:400}
.link{flex:0 0 46px;height:2px;background:linear-gradient(90deg,transparent,var(--line),transparent);
  position:relative}
.link b{position:absolute;left:50%;top:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
  border-radius:50%;background:var(--line)}
.knot.strong .link{background:linear-gradient(90deg,transparent,rgba(126,214,178,.6),transparent)}
.knot.strong .link b{background:var(--mint);box-shadow:0 0 0 3px rgba(126,214,178,.18)}
.week7{display:flex;gap:6px;justify-content:center;margin:13px 0 9px}
.dot7{width:26px;height:26px;border-radius:9px;display:grid;place-items:center;
  background:rgba(255,255,255,.045);border:1px solid transparent}
.dot7 i{font-style:normal;font-size:.66rem;color:var(--dim)}
.dot7.half{background:rgba(217,180,95,.10)}
.dot7.half i{color:rgba(217,180,95,.75)}
.dot7.on{background:rgba(126,214,178,.20)}
.dot7.on i{color:var(--mint);font-weight:700}
.dot7.today{border-color:rgba(255,255,255,.22)}
.knot-foot{text-align:center;font-size:.78rem;color:var(--muted)}
.knot-foot b{color:var(--ink);font-size:.95rem;font-variant-numeric:tabular-nums}
.knot.strong .knot-foot b{color:var(--mint)}
/* 选人的圆头像 */
.pk button[data-me],.pk button[data-pick]{width:44px;height:44px;padding:0;border-radius:50%;
  font-size:.82rem;font-weight:600;display:grid;place-items:center}
.pk button[data-pick]{border-color:rgba(217,180,95,.5);background:rgba(217,180,95,.14);color:var(--gold)}
.pk .cancel{width:auto;height:32px;padding:0 13px;border-radius:999px;font-size:.76rem}

/* ── 玩闹：不说话的时候两只来回跑、互相追（老板 2026-08-15）── */
.cats.romp .cwrap{position:relative}
.cats.romp #fcatS{animation:runS 5.2s cubic-bezier(.45,0,.55,1) infinite}
.cats.romp #fcatD{animation:runD 5.2s cubic-bezier(.45,0,.55,1) infinite}
@keyframes runS{
  0%{transform:translateX(0) scaleX(1)}
  22%{transform:translateX(58px) scaleX(1)}
  26%{transform:translateX(58px) scaleX(-1)}
  50%{transform:translateX(-46px) scaleX(-1)}
  54%{transform:translateX(-46px) scaleX(1)}
  78%{transform:translateX(30px) scaleX(1)}
  100%{transform:translateX(0) scaleX(1)}}
@keyframes runD{
  0%{transform:translateX(0) scaleX(1)}
  8%{transform:translateX(6px)}
  30%{transform:translateX(62px) scaleX(1)}
  34%{transform:translateX(62px) scaleX(-1)}
  58%{transform:translateX(-40px) scaleX(-1)}
  62%{transform:translateX(-40px) scaleX(1)}
  86%{transform:translateX(26px) scaleX(1)}
  100%{transform:translateX(0) scaleX(1)}}
/* 跑起来的时候腿脚有点动静 */
.cats.romp .fcat{animation-name:runS,hopper}
.cats.romp #fcatD{animation-name:runD,hopper}
@keyframes hopper{0%,100%{margin-top:0}25%{margin-top:-5px}50%{margin-top:0}75%{margin-top:-3px}}
.cats.romp .fcat .tail{animation:fflick .5s ease-in-out infinite}
.cats.romp .cline .sp{opacity:0;transition:opacity .3s}
.romp-tip{display:block;text-align:center;font-size:.72rem;color:var(--muted);opacity:.8}
@media (prefers-reduced-motion:reduce){.cats.romp .fcat{animation:none !important}}

.tag-go{font-size:.68rem;color:var(--mint);border:1px solid rgba(126,214,178,.4);
  border-radius:99px;padding:1px 7px}
.tag-w{font-size:.68rem;color:var(--muted);border:1px solid var(--line);
  border-radius:99px;padding:1px 7px}
.tag-x{font-size:.68rem;color:#ff9cb2;border:1px solid rgba(255,120,149,.4);
  border-radius:99px;padding:1px 7px}
.knot-act{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);
  display:flex;flex-wrap:wrap;gap:7px;align-items:center;justify-content:center}
.knot-act span{flex-basis:100%;text-align:center;font-size:.72rem;color:var(--muted)}
.knot-act button{border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--muted);border-radius:999px;padding:5px 12px;font-size:.75rem;font-family:inherit}
.knot-act .agree{border-color:rgba(255,120,149,.45);color:#ff9cb2}
.knot-act .undo{border-color:rgba(217,180,95,.4);color:var(--gold)}
.knot.broken{opacity:.6}


/* 每个人按自己的门数走一条进度条（博远六门，别人一门） */
.pbar{height:4px;border-radius:99px;background:rgba(255,255,255,.07);margin-top:7px;overflow:hidden}
.pbar i{display:block;height:100%;width:0;border-radius:99px;background:var(--dim);
  transition:width .7s cubic-bezier(.2,.8,.3,1)}

.mins{font-size:.7rem;color:var(--muted);margin-top:5px}

  padding-top:12px;border-top:1px solid var(--line)}

.solo .si{width:15px;text-align:center;font-size:.74rem;color:var(--muted);
  font-variant-numeric:tabular-nums}

.solo .sd{font-size:.76rem;color:var(--muted);white-space:nowrap}
.solo .sd b{color:var(--ink);font-size:.92rem;font-variant-numeric:tabular-nums}
.solo.on .sd b{color:var(--gold)}
.sbadge{font-size:.63rem;color:var(--mint);border:1px solid rgba(126,214,178,.4);
  border-radius:99px;padding:1px 7px;white-space:nowrap}

.pk .tellta{display:inline-flex;align-items:center;border:1px solid rgba(126,214,178,.45);
  background:rgba(126,214,178,.12);color:var(--mint);border-radius:999px;
  padding:6px 13px;font-size:.78rem;font-weight:600;text-decoration:none}
.pk .tellta:active{opacity:.75}

<script>
/* 一家人一起学（老板 2026-08-15 出的主意）
   排名刻意不按数量排——八岁的跟十六岁的比多少，落后那个直接不玩了。
   只看两样：今天来没来、连着多少天没断。这两样各个年纪是公平的。 */
const API="https://yusufs-macbook-pro.tail63c9ae.ts.net";

function chain(n){
  if(n<=0)return "还没开始";
  return "连着 <b>"+n+"</b> 天";
}
function render(d){
  const ps=d.people||[];
  try{renderToys(d.toy)}catch(e){}
  const here=ps.filter(p=>p.here).length, fin=ps.filter(p=>p.finished).length;
  /* 老板 2026-08-15：「他完成才算」——顶上这个数只数做完的，不是来过的。来过但没做完，看那一行的进度条。 */
  document.getElementById("hereN").textContent=fin;
  document.getElementById("hereTot").textContent="／ "+ps.length+" 人";
  document.getElementById("lamp").style.width=(ps.length?fin/ps.length*100:0)+"%";

  document.getElementById("list").innerHTML=ps.map(p=>{
    const cls=p.finished?"fin":(p.here?"here":"away");
    const what=p.finished
      ? '<em>今天做完了</em>'
      : (p.here ? p.what+" · 在做" : p.what);
    const right = p.auto
      ? '<div class="cnt">'+(p.here? p.done+" / "+p.total : "—")+'</div>'+
        '<div class="kp">'+chain(p.streak)+'</div>'
      : '<button class="tick'+(p.here?" on":"")+'" data-id="'+p.id+'" data-nm="'+p.name+
        '" data-here="'+(p.here?1:0)+'"'+(p.here?' disabled title="打完的卡不能自己取消"':'')+
        '>'+(p.here?"已打卡":"今天来了")+'</button>'+
        '<div class="kp">'+chain(p.streak)+'</div>';
    /* 点名字进那个人自己的页面。玺雅还没有页面，就不做成链接。 */
    const paw = p.here ? '<svg class="paw" viewBox="0 0 24 24" fill="currentColor" '+
      'style="color:'+(p.finished?'var(--mint)':'var(--gold)')+'">'+
      '<ellipse cx="12" cy="15.5" rx="5.4" ry="4.6"/><ellipse cx="5.6" cy="10.6" rx="2.5" ry="3.1"/>'+
      '<ellipse cx="18.4" cy="10.6" rx="2.5" ry="3.1"/><ellipse cx="9.2" cy="6" rx="2.3" ry="2.9"/>'+
      '<ellipse cx="14.8" cy="6" rx="2.3" ry="2.9"/></svg>' : '';
    const who='<div class="nm">'+p.name+paw+(p.url?'<i class="go">›</i>':'')+'</div>'+
              '<div class="wt">'+what+'</div>'+
              /* 每人按自己的门数走一条进度（老板 2026-08-15） */
              /* 老板 2026-08-15：进度条按「在里面待了多久」走，
                 这样别人一眼看得出谁真学了很久，而不是进去出来点一下。 */
              '<div class="pbar'+(p.finished?" done":p.here?" going":"")+'">'+
                '<i style="width:'+Math.min(100,Math.round(((p.mins||0)/(p.goal||15))*100))+'%"></i>'+
              '</div>'+
              /* 老板 2026-08-15：「不要写学了多长时间。只有进度条就可以了。
                 不然博远看到其他人只学了几分钟，他就不开心了」——
                 各人的目标本来就不一样（博远30分、爸爸5分），把分钟摆出来
                 等于请孩子互相比，比了就伤人。所以只留进度条。 */
              '';
    const whoBlk = p.url
      ? '<a class="who" href="'+p.url+'">'+who+'</a>'
      : '<div class="who">'+who+'</div>';
    return '<li class="'+cls+'">'+
      '<span class="dot"></span>'+ whoBlk +
      '<div class="right">'+right+'</div>'+
      '</li>';
  }).join("");

  /* 猫跟着今天来了的人。没人来时，两只自己玩、轮流说话。 */
  const tryers=ps.filter(p=>p.here).map(p=>p.name);
  const cb=document.getElementById("catsBox"), cl=document.getElementById("catLine");
  if(!tryers.length){
    catsIdle(cb, cl);      /* 没人来：两只自己玩、自己聊 */
    document.getElementById("note").innerHTML="今天还没人开始。<b>谁先来，谁把灯点上。</b>";
    document.getElementById("foot").textContent=d.date+" · 点名字进各自的页面 · 每分钟自己刷新";
    bindTicks();
    return;                /* 行在上面已经画好了，不用再画 */
  }
  catsActive(cb, cl, ps);   /* 有人来了：猫也说话——夸已经开始的，招呼还没来的 */

  const away=ps.filter(p=>!p.here).map(p=>p.name);
  const note=document.getElementById("note");
  if(!ps.length){ note.textContent=""; }
  else if(!away.length){ note.innerHTML="<b>今天全家都来了。</b>这样的日子不多，记住它。"; }
  else if(here===0){ note.innerHTML="今天还没人开始。<b>谁先来，谁把灯点上。</b>"; }
  else { note.innerHTML="还差 <b>"+away.join("、")+"</b>。别催，去问一句就行。"; }

  /* 没有自己页面的人（玺雅、霏雅、Amina）手动打卡。
     故意加一句确认，免得家里人互相误点。 */
  bindTicks();
  document.getElementById("foot").textContent=d.date+" · 点名字进各自的页面 · 每分钟自己刷新";
}
function bindTicks(){
  [...document.querySelectorAll(".tick")].forEach(b=>{
    b.onclick=async ()=>{
      const nm=b.dataset.nm;
      /* 老板 2026-08-15：「已打卡只能爸爸可以点，其他人不能点」——
         所以打完就点不动了，界面上不放任何"我是爸爸"的开关。
         要取消，爸爸跟小林说一声，我在后台改。 */
      if(b.disabled)return;
      if(!confirm(nm+"今天学过了吗？")) return;
      b.disabled=true;
      try{
        await fetch(API+"/fam/ping",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({who:b.dataset.id,done:1,total:1,manual:true})});
      }catch(e){}
      load();
    };
  });
}
async function load(){
  try{
    const r=await fetchT(API+"/fam/board",{cache:"no-store"},5000);
    render(await r.json());
  }catch(e){
    /* 连不上家里那台机器时，退回读 GitHub 上的快照。
       快照是每两分钟推一次的，看到的不是实时，但外面的人至少看得见。
       打卡和选搭子还是得在家里的网络上做——这一点在下面写明了，不含糊。 */
    try{
      const sn=await (await fetchT("./board-snapshot.json?cb="+Date.now(),{cache:"no-store"},5000)).json();
      if(sn && sn.board){
        render(sn.board);
        const note=document.getElementById("note");
        if(note)note.innerHTML='<b>这是 '+sn.at+' 的样子。</b>'+
          '现在连不上家里那台电脑，看到的不是实时的。'+
          '打卡和选搭子要在家里的 wifi 上才能做，小林正在把这块搬到网上。';
        try{ if(sn.pairs)paintPairs(sn.pairs, true) }catch(e3){}
        document.getElementById("foot").textContent=sn.at+" 的快照 · 不是实时";
        return;
      }
    }catch(e2){}
    document.getElementById("list").innerHTML=
      '<li><div class="who"><div class="nm">现在看不到今天的记录</div>'+
      '<div class="wt">这个榜的数据放在家里那台电脑上，从外面的网络暂时连不进来。'+
      '小林正在改。你自己那一页照常能用，学的时间会记着，等这边通了会自动补上。</div></div></li>';
    document.getElementById("catLine").innerHTML=
      '<span class="sp"><b>Snowy</b>　我们等一会儿，家里的线还没通。</span>';
  }
}
load(); renderPairs(); setInterval(load,60000); setInterval(renderPairs,60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden)load() });

/* ── 没人来的时候，两只自己玩、自己聊（老板 2026-08-15：
      「能不能有一些互动，他们俩之间相互玩耍」「说一些希望家人来参与的一些话」）──
   写的时候按各自性子：Snowy 温和会等，哆米烈、嘴硬心软。
   刻意不写成催——老板自己定过榜上「别催，去问一句就行」。 */
const CHAT=[
 [["哆米","家里今天好安静。"],["Snowy","我们先玩一会儿，等大家回来。"]],
 [["哆米","别晃你那尾巴。"],["Snowy","那你别扑它。"]],
 [["哆米","他们是不是把我们忘了。"],["Snowy","没有。昨天还有人来。"]],
 [["Snowy","今天谁会先来呢。"],["哆米","谁先来，我们就陪谁学五分钟。"]],
 [["哆米","无聊。"],["Snowy","那我陪你玩一会儿。"]],
 [["Snowy","门是不是开了？"],["哆米","……风。"]],
 [["哆米","我数到一百他们还不来，我就睡了。"],["Snowy","你上次数到七就睡了。"]],
 [["Snowy","爸爸、妈妈和孩子们都来就好了。"],["哆米","学什么都行，来了家里就热闹。"]],
 [["哆米","爸爸今天会来吗。"],["Snowy","他忙。忙完会来的。"]],
 [["Snowy","来一个也好。"],["哆米","第一个来的，是把大家等回来的人。"]],
 [["哆米","位置我占着了。"],["Snowy","旁边都给家人留着，快来坐吧。"]],
 [["Snowy","你耳朵动了。"],["哆米","我听见脚步声了……没有。"]],
 [["哆米","要是今天一个都没有呢。"],["Snowy","那我们就等明天。也没什么。"]],
 [["Snowy","我今天特意把毛理了理。"],["哆米","给谁看。"]],
 [["哆米","……给他们看。快来吧。"],["Snowy","嗯，我们一直在。"]]
];
let chatN=0, chatTimer=null, playN=1, catNext=null;
function catsIdle(box, cl){
  if(chatTimer)clearInterval(chatTimer);
  function tick(){
    const toy=showNextToy();
    const pair=CHAT[chatN%CHAT.length]; chatN++;
    playN=(playN%4)+1;
    box.className="cats waiting p"+playN;
    cl.innerHTML=pair.map(function(x){
      return '<span class="sp'+(x[0]==="哆米"?" d":"")+'"><b>'+x[0]+'</b>　'+x[1]+'</span>';
    }).join("")+'<small class="tapcat">正在玩 '+toy[1]+' · 点一下换一个</small>';
  }
  catNext=tick;
  tick();
  chatTimer=setInterval(tick,7000);
}
document.getElementById("catStage").addEventListener("click",()=>{
  if(catNext)catNext();
});
document.getElementById("catStage").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&catNext&&document.getElementById("catsBox").classList.contains("waiting")){
    e.preventDefault();catNext();
  }
});

/* ── 有人来之后，两只也要说话（老板 2026-08-15：
      「来了之后也让他们有些互动，说一些话鼓励已经开始的人，催还没有来的人」
      他说按我自己的想法来，那我定两条规矩）：
   一、夸人要点名、要具体，不说"你真棒"这种。
   二、招呼没来的人**不许带责备**——老板自己给这榜定过「别催，去问一句就行」。
      所以让猫用猫的办法：去门口等、把位置占着、说想他了。 */
function catsActive(box, cl, ps){
  if(chatTimer)clearInterval(chatTimer);
  const here=ps.filter(p=>p.here), fin=ps.filter(p=>p.finished),
        away=ps.filter(p=>!p.here), doing=here.filter(p=>!p.finished);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  function lines(){
    const L=[];
    /* 夸做完的 */
    fin.forEach(function(p){
      L.push([["Snowy",p.name+"做完了。今天那份饭我不抢。"],["哆米",p.name+"，干得利索。"]]);
      if(p.streak>=3)L.push([["哆米",p.name+"连着"+p.streak+"天了。"],["Snowy","这个不容易，我记着呢。"]]);
    });
    /* 鼓励正在做的 */
    doing.forEach(function(p){
      L.push([["Snowy",p.name+"在做了，还剩"+(p.total-p.done)+"关。"],["哆米","我盯着，你慢慢来。"]]);
      L.push([["哆米",p.name+"开了头就别停。"],["Snowy","停一下也行，我等着。"]]);
    });
    /* 招呼还没来的 —— 用猫的办法，不带责备 */
    away.forEach(function(p){
      L.push([["哆米",p.name+"还没来。我去门口蹲着。"],["Snowy","位置我给留着呢。"]]);
      L.push([["Snowy","要是"+p.name+"来了，我就去旁边趴着。"],["哆米","那我占另一边。"]]);
    });
    /* 全家到齐 */
    if(!away.length){
      L.push([["Snowy","今天全家都在。"],["哆米","这样的日子不多。我记住了。"]]);
      L.push([["哆米","六个人。忙不过来了。"],["Snowy","那就一人陪一会儿。"]]);
    }
    /* 第一个来的 */
    if(here.length===1){
      L.push([["Snowy",here[0].name+"是今天第一个。"],["哆米","第一个来的，把灯点上了。"]]);
    }
    return L.length? L : [[["Snowy","今天有人来了。"],["哆米","嗯。"]]];
  }
  const pool=lines();
  let n=Math.floor(Math.random()*pool.length);
  function tick(){
    if(rompMaybe(box, cl))return;      /* 有人来了也一样，说三轮跑一段 */
    const pair=pool[n%pool.length]; n++;
    cl.innerHTML=pair.map(function(x){
      return '<span class="sp'+(x[0]==="哆米"?" d":"")+'"><b>'+x[0]+'</b>　'+x[1]+'</span>';
    }).join("")+'<small class="tapcat">点一下小猫，看它们再说一句</small>';
  }
  box.className="cats awake talking";
  catNext=tick;
  tick();
  chatTimer=setInterval(tick,7000);
}

/* ── 玩具：全家累计来过多少人次，就永久攒下多少玩具 ──
   后端一共设了 12 个解锁档位，这里也必须有 12 件；否则坚持到第 7 件后页面不会再变。 */
const TOYS=[
 ["yarn","毛线球",'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#c98b8b"/>'+
   '<path d="M4 10c5-3 11-3 16 0M3 14c5 3 12 3 18 0M8 3c-2 6-2 12 0 18M16 3c2 6 2 12 0 18" '+

const BUTTERFLY=["butterfly","飞来的蝴蝶",'<svg viewBox="0 0 28 24"><g class="w1"><ellipse cx="8" cy="9" rx="7" ry="6" fill="#e5b96a" opacity=".9"/>'+
  '<ellipse cx="9" cy="17" rx="5.5" ry="5" fill="#d9a24f" opacity=".85"/></g>'+
  '<g class="w2"><ellipse cx="20" cy="9" rx="7" ry="6" fill="#e5b96a" opacity=".9"/>'+
  '<ellipse cx="19" cy="17" rx="5.5" ry="5" fill="#d9a24f" opacity=".85"/></g>'+
  '<rect x="13" y="6" width="2" height="14" rx="1" fill="#5b4a2e"/></svg>'];
let toyState={points:0,toys:0,total:12,next:1,need:1}, toyN=0;
function showNextToy(){
  /* 还没解锁时，蝴蝶会带毛球来试玩；第一次学习后毛球才真正留在玩具篮。 */
  const playCount=Math.max(1,Math.min(toyState.toys||0,TOYS.length));
  const choices=[BUTTERFLY].concat(TOYS.slice(0,playCount));
  const t=choices[toyN%choices.length]; toyN++;
  const box=document.getElementById("toyBox");
  if(box)box.innerHTML='<div class="toy '+t[0]+'">'+t[2]+'</div>';
  return t;
}
function renderToys(toy){
  const box=document.getElementById("toyBox"); if(!box||!toy)return;
  toyState=toy;
  const n=Math.min(toy.toys||0,TOYS.length), total=Math.max(TOYS.length,toy.total||0);
  showNextToy();
  const cl=document.getElementById("catLine");
  var line=document.getElementById("toyLine");
  if(!line){ line=document.createElement("p"); line.id="toyLine"; line.className="toyline";
             cl.parentNode.appendChild(line) }
  var shelf=document.getElementById("toyShelf");
  if(!shelf){ shelf=document.createElement("div"); shelf.id="toyShelf"; shelf.className="toyshelf";
              line.parentNode.appendChild(shelf) }
  shelf.innerHTML=TOYS.slice(0,n).map(function(t){
    return '<span class="toybadge" title="'+t[1]+'" aria-label="'+t[1]+'">'+t[2]+'</span>';
  }).join("")+(n<TOYS.length?'<span class="toybadge locked" aria-label="下一件还未解锁">'+
      (toy.need?('还差 '+toy.need+' 次'):'下一件')+'</span>':'');
  if(n===0){ line.innerHTML="蝴蝶带毛球来陪它们试玩。全家一起学满 <b>1</b> 次，毛球就真正留下。"; return }
  line.innerHTML = toy.next
    ? "玩具篮 <b>"+n+" / "+total+"</b> 件 · 全家再学 <b>"+toy.need+"</b> 次，又多一件。"
    : "<b>玩具全齐了。</b>这是全家 "+toy.points+" 次学习攒下来的。";
}

/* ── 本周搭子 ──
   老板：一星期选一次。所以每周一自动翻页，上周的成绩留着。
   双向选中才算成对——A 选 B、B 也选 A。单方面的只算「想约」，
   界面上明说，免得有人以为自己有搭子其实没有。 */
async function renderPairs(){
  const box=document.getElementById("pairBox"); if(!box)return;
  let d;
  try{ d=await (await fetchT(API+"/fam/pairs",{cache:"no-store"},5000)).json() }
  catch(e){
    /* 连不上家里那台机器时，用快照里的搭子数据画 —— 快照里本来就存了，
       我第一版只画了榜、忘了画搭子，凯问「本周搭子出不来」就是这个。 */
    try{
      const sn=await (await fetchT("./board-snapshot.json?cb="+Date.now(),{cache:"no-store"},5000)).json();
      if(sn && sn.pairs){ paintPairs(sn.pairs, true); return }
    }catch(e2){}
    document.getElementById("pbTip").textContent="搭子这块暂时连不上，通了会自己回来。";
    document.getElementById("pbList").innerHTML=""; document.getElementById("pbPick").innerHTML="";
    return;
  }
  paintPairs(d, false);
}
function paintPairs(d, offline){
  document.getElementById("pbWeek").textContent=d.week||"";
  const L=document.getElementById("pbList"), P=document.getElementById("pbPick");

  document.getElementById("pbTip").innerHTML =
    "搭子的天数<b>只算两个人都来的日子</b>。一个人没来，那天就不算。";

  /* 老板 2026-08-15 说这块「设计得很难看」。重画：
     两个名字用一条线连起来，中间一个结；下面七个点是这一周，
     两个人都来的那天才亮。一眼看得出这周绑得牢不牢。 */
  const WD=["一","二","三","四","五","六","日"];
  L.innerHTML=(d.pairs||[]).map(function(p,i){
    const lit=p.weekDays, strong=lit>0;
    const dots=(p.days||[]).map(function(x,j){
      const both=x.a&&x.b, half=(x.a||x.b)&&!both;
      const today=j===(p.days.length-1);
      return '<span class="dot7'+(both?" on":half?" half":"")+(today?" today":"")+'">'+
             '<i>'+WD[j]+'</i></span>';
    }).join("");
    return '<div class="knot'+(p.broken?" broken":strong?" strong":"")+'">'+
      '<div class="knot-top">'+
        '<span class="kn '+(p.aHere?"on":"")+'">'+p.aName+'</span>'+
        '<span class="link"><b></b></span>'+
        '<span class="kn '+(p.bHere?"on":"")+'">'+p.bName+'</span>'+
      '</div>'+
      '<div class="week7">'+dots+'</div>'+
      '<div class="knot-foot">这周一起来了 <b>'+lit+'</b> 天'+
        (p.broken?'　<span class="tag-x">已解除</span>':
         p.started?'　<span class="tag-go">已开始</span>':
                   '　<span class="tag-w">还没开始</span>')+'</div>'+
      (p.broken?'':
        p.quitBy
          ? '<div class="knot-act"><span>'+(p.quitBy===p.a?p.aName:p.bName)+
            ' 想散伙了。对方点头才算数。</span>'+
            '<button class="agree" data-agree="'+(p.quitBy===p.a?p.b:p.a)+'">我同意</button></div>'
          : (p.started
              ? '<div class="knot-act"><span>开始了就不能重选。真要散，得对方同意。</span>'+
                '<button class="quit" data-quit="'+p.a+'">'+p.aName+' 提散伙</button>'+
                '<button class="quit" data-quit="'+p.b+'">'+p.bName+' 提散伙</button></div>'
              : '<div class="knot-act"><span>还没开始，选错了可以改。</span>'+
                '<button class="undo" data-undo="'+p.a+'" data-undo2="'+p.b+'">重选</button></div>'))+
      '</div>';
  }).join("") || '<div class="knot empty"><div class="knot-top">'+
      '<span class="kn ghost">谁</span><span class="link"><b></b></span>'+
      '<span class="kn ghost">谁</span></div>'+
      '<div class="knot-foot">本周还没有人成对。两个人选中彼此，才算一对。</div></div>';

  /* 老板 2026-08-15：「没有成为搭子的也可以自己学，但是排名你看着如何设计」
     我的设计：两个榜分开排。
     搭子榜按「两个人都到的天数」，单飞榜按「自己到的天数」。
     不混排——搭子那个数天生更难拿（要两个人都到），混在一起对搭子不公平；
     分开之后，一个人学的也有自己的头名可争。
     年纪、做了多少题一律不进排名，只看到没到。 */
  const S=document.getElementById("pbSolo");
  if(S){
    const so=d.solo||[];
    S.innerHTML = so.length
      ? '<div class="solo-h">一个人学的</div>'+so.map(function(x,i){
          return '<div class="solo'+(x.here?" on":"")+'">'+
            '<span class="si">'+(i+1)+'</span>'+
            '<span class="sn">'+x.name+'</span>'+
            (x.asGoodAsPair?'<span class="sbadge">顶得上一对</span>':'')+
            '<span class="sd"><b>'+x.days+'</b> / '+x.total+' 天</span></div>';
        }).join("")
      : "";
  }
  /* 老板 2026-08-15 看了截图说「这个界面好丑」——原来用浏览器原生 prompt 弹窗，
     还得手打名字。手机上难用，博远十岁更打不来。改成点两下：
     先点自己，下面就出来能选的人，再点一个，成。 */
  let picking=null;
  function paint(){
    /* 离线（读的是快照）时不给选人的入口 —— 点了也写不进去，
       给个真按钮却按不动，比不给更糟。 */
    if(offline){
      P.innerHTML='<p class="pb-tip" style="margin:10px 0 0">'+
        '这是快照。选搭子、打卡要在家里的 wifi 上做。</p>';
      return;
    }
    let h="";
    if((d.asked||[]).length){
      /* 老板 2026-08-15 问「我如何邀请别人做搭子」——
         原来选完只是单方面记一笔，对方不知道，得碰巧打开榜才看见。
         加一个「告诉TA」，直接把话发出去。 */
      h+='<div class="pk"><span class="who2">还在等对方点头：</span>'+
        d.asked.map(function(a){
          const msg=encodeURIComponent(
            a.aName+"想跟你做这周的搭子。\n\n搭子的天数只算两个人都来的日子——"+
            "你不来，"+a.aName+"的也没了。\n\n你去这里点一下自己的名字，再点「"+a.aName+"」就算成了：\n"+
            "https://yousef0755.github.io/daily-english/family.html");
          return '<button class="wait" disabled>'+a.aName+' 想约 '+a.bName+'</button>'+
                 '<a class="tellta" href="https://wa.me/?text='+msg+'" target="_blank" rel="noopener">告诉 '+a.bName+'</a>';
        }).join("")+'</div>';
    }
    if(picking){
      const me=(d.free||[]).find(f=>f.id===picking)||{name:""};
      const others=(d.free||[]).filter(f=>f.id!==picking);
      h+='<div class="pk"><span class="who2">'+me.name+'，想跟谁做这周的搭子？'+
        '选完会给你一个「告诉TA」，把邀请发过去，对方点头才算成。</span>'+
        others.map(o=>'<button class="go2" data-pick="'+o.id+'" title="'+o.name+'">'+shortName(o.name)+'</button>').join("")+
        '<button class="cancel" data-cancel="1">算了</button></div>';
    }else if(!offline && (d.free||[]).length){
      h+='<div class="pk"><span class="who2">还没选搭子的，点自己的名字：</span>'+
        d.free.map(f=>'<button data-me="'+f.id+'" title="'+f.name+'">'+shortName(f.name)+'</button>').join("")+'</div>';
    }
      P.innerHTML=h;
    [...P.querySelectorAll("button[data-me]")].forEach(b=>b.onclick=()=>{picking=b.dataset.me;paint()});
    [...P.querySelectorAll("button[data-cancel]")].forEach(b=>b.onclick=()=>{picking=null;paint()});
    [...P.querySelectorAll("button[data-pick]")].forEach(function(b){
      b.onclick=async function(){
        const me=picking; picking=null;
        b.disabled=true; b.textContent="…";
        await fetch(API+"/fam/pair",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({who:me,partner:b.dataset.pick})});
        renderPairs();
      };
    });
  }
  paint();
  /* 老板 2026-08-15 定的规矩：没开始能重选；开始了要散伙得对方点头；
     散过的这周就当不成第一（服务端已经把它排到最后）。 */
  async function act(url, body){
    const r=await (await fetch(API+url,{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})).json();
    if(r.why==="started")alert("已经开始了，不能直接换。真要散，得对方同意。");
    renderPairs();
  }
  [...L.querySelectorAll("button[data-undo]")].forEach(b=>b.onclick=async()=>{
    if(!confirm("重选搭子？这一对会解开。"))return;
    await act("/fam/pair",{who:b.dataset.undo,partner:""});
    await act("/fam/pair",{who:b.dataset.undo2,partner:""});
  });
  [...L.querySelectorAll("button[data-quit]")].forEach(b=>b.onclick=async()=>{
    if(!confirm("提出散伙？对方同意之后，这周你们就当不成第一了。"))return;
    await act("/fam/quit",{who:b.dataset.quit});
  });
  [...L.querySelectorAll("button[data-agree]")].forEach(b=>b.onclick=async()=>{
    if(!confirm("同意散伙？散了就不能反悔，这周的成绩也不算了。"))return;
    await act("/fam/quit",{who:b.dataset.agree,agree:true});
  });
}

/* 中文名取后两字，拉丁名取前两字 —— 之前一律取末两字，Amina 成了 "na"。 */
function shortName(n){
  return /^[\x00-\x7f]+$/.test(n) ? n.slice(0,2) : n.slice(-2);
}

/* ── 玩闹一小会儿 ──
   老板：「不对话的时候让他们在屏幕来回跑，一起玩耍」。
   每说三轮话，插一段六秒的追逐，跑完接着说。不抢话，只在空档里跑。 */
let rompN=0;
function rompMaybe(box, cl){
  rompN++;
  if(rompN % 3 !== 0) return false;
  const keep=box.className;
  box.className=keep+" romp";
  cl.innerHTML='<small class="romp-tip">（两只跑起来了）</small>';
  setTimeout(function(){
    box.className=keep;
    if(catNext)catNext();
  },6200);
  return true;
}


/* 老板 2026-08-15：「新的手机点的时候老是网页显示不完」。
   原因是取数据的请求连不上又不超时，页面就一直卡在「正在看…」。
   加 5 秒上限：连不上就立刻按离线渲染，页面照样是完整的。 */
function fetchT(url, opt, ms){
  opt=opt||{}; ms=ms||5000;
  var ac=new AbortController(); opt.signal=ac.signal;
  var t=setTimeout(function(){ac.abort()},ms);
  return fetch(url,opt).finally(function(){clearTimeout(t)});
}
