<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111f">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="apple-touch-icon" href="./kid-icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="一家人">
<title>一家人 · 今天</title>
<style>
:root{
  --bg:#07111f; --bg-2:#0b1929; --card:rgba(255,255,255,.045);
  --line:rgba(255,255,255,.10); --ink:#eef3f8; --muted:#8fa3b8;
  --gold:#d9b45f; --mint:#7ed6b2; --dim:#3c4d61;
  --serif:'Songti SC','Iowan Old Style',Georgia,serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:
   radial-gradient(1100px 620px at 50% -12%, #12263f 0%, transparent 62%),
   var(--bg);
  color:var(--ink);line-height:1.7;
  font-family:-apple-system,'PingFang SC','Segoe UI',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh}
.wrap{max-width:520px;margin:0 auto;padding:30px 18px 44px}

header{text-align:center;margin-bottom:24px}
.eyebrow{font-size:.68rem;letter-spacing:.26em;color:var(--muted);margin:0 0 9px}
h1{font-family:var(--serif);font-weight:400;font-size:1.85rem;margin:0 0 12px;letter-spacing:.02em}
.today{display:inline-flex;align-items:baseline;gap:8px;
  border:1px solid var(--line);border-radius:99px;padding:6px 16px;
  background:var(--card);font-size:.83rem;color:var(--muted)}
.today b{font-size:1.15rem;color:var(--gold);font-variant-numeric:tabular-nums}

/* 一家人的那盏灯：全来了就整条亮起来 */
.lamp{height:3px;border-radius:99px;background:rgba(255,255,255,.07);
  margin:20px 0 22px;overflow:hidden}
.lamp i{display:block;height:100%;width:0;border-radius:99px;
  background:linear-gradient(90deg,var(--gold),var(--mint));
  transition:width 1s cubic-bezier(.2,.8,.3,1)}

ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
li{display:flex;align-items:center;gap:13px;padding:14px 15px;
  background:var(--card);border:1px solid var(--line);border-radius:16px;
  transition:border-color .4s ease,opacity .4s ease}
li.away{opacity:.52}
li.here{border-color:rgba(217,180,95,.3)}
li.fin{border-color:rgba(126,214,178,.42)}

.dot{width:11px;height:11px;border-radius:50%;flex:none;background:var(--dim)}
li.here .dot{background:var(--gold);box-shadow:0 0 0 4px rgba(217,180,95,.14)}
li.fin .dot{background:var(--mint);box-shadow:0 0 0 4px rgba(126,214,178,.16)}

.who{flex:1;min-width:0}
.nm{font-size:1.02rem;font-weight:600;letter-spacing:.01em}
.wt{font-size:.76rem;color:var(--muted);margin-top:2px}
.wt em{font-style:normal;color:var(--mint)}

.right{text-align:right;flex:none}
.cnt{font-size:.95rem;font-variant-numeric:tabular-nums;color:var(--muted)}
li.fin .cnt{color:var(--mint)}
li.here .cnt{color:var(--gold)}
.kp{font-size:.7rem;color:var(--muted);margin-top:3px;white-space:nowrap}
.kp b{color:var(--ink);font-variant-numeric:tabular-nums}

.note{margin:26px 0 0;padding:15px 16px;background:rgba(255,255,255,.03);
  border:1px solid var(--line);border-radius:16px;
  font-size:.83rem;color:var(--muted);line-height:1.85}
.note b{color:var(--gold)}
footer{margin-top:22px;text-align:center;font-size:.7rem;color:var(--dim)}
@media (prefers-reduced-motion:reduce){*{transition:none !important}}

.tick{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--muted);
  border-radius:999px;padding:7px 13px;font-size:.78rem;font-family:inherit;
  font-weight:600;cursor:pointer;white-space:nowrap}
.tick.on{border-color:rgba(126,214,178,.45);background:rgba(126,214,178,.14);color:var(--mint)}
.tick:disabled{opacity:.5}

a.who{text-decoration:none;color:inherit;display:block}
a.who:active .nm{opacity:.6}
.nm .go{font-style:normal;color:var(--gold);margin-left:6px;font-size:.95em;opacity:.75}

/* ── 猫跟着努力的人（老板 2026-08-15：努力的人和小猫咪在一起）── */
.cats{margin:4px 0 18px;text-align:center}
.cwrap{display:flex;justify-content:center;align-items:flex-end;gap:2px}
.fcat{width:74px;height:auto;overflow:visible;transition:opacity .5s ease,filter .5s ease}
.fcat .tail{transform-origin:152px 130px}
.fcat .earL{transform-origin:76px 60px}
.fcat .earR{transform-origin:124px 60px}
/* 首次数据回来前先安静等候；确认没人来后会切到 waiting 互动。 */
.fcat .open{opacity:0}
.fcat .shut{opacity:1}
.cats.asleep .fcat{opacity:.4;filter:saturate(.35)}
.cats.asleep .fcat{animation:fbreathe 4.6s ease-in-out infinite}
@keyframes fbreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
/* 有人来：睁眼、耳朵动、尾巴甩 */
.cats.awake .fcat .open{opacity:1}
.cats.awake .fcat .shut{opacity:0}
.cats.awake .fcat .tail{animation:fflick 1.5s ease-in-out infinite}
.cats.awake #fcatS .earL{animation:fearL 2.7s ease-in-out infinite}
.cats.awake #fcatD .earR{animation:fearR 2.7s ease-in-out infinite}
@keyframes fflick{0%,100%{transform:rotate(0)}50%{transform:rotate(-15deg)}}
@keyframes fearL{0%,100%{transform:rotate(0)}50%{transform:rotate(-11deg)}}
@keyframes fearR{0%,100%{transform:rotate(0)}50%{transform:rotate(11deg)}}
.cline{margin:9px 0 0;font-size:.85rem;line-height:1.75;color:var(--muted)}
.cline b{color:var(--gold)}
.cats.awake .cline b{color:var(--mint)}
/* 谁身边有猫，行上带个爪印 */
.paw{display:inline-block;width:13px;height:13px;margin-left:7px;vertical-align:-1px;opacity:.9}
@media (prefers-reduced-motion:reduce){.fcat,.fcat *{animation:none !important}}

/* ── 没人来的时候两只自己玩（老板 2026-08-15）── */
.cats.waiting .fcat{opacity:1;filter:none}
.cats.waiting .fcat .open{opacity:1}
.cats.waiting .fcat .shut{opacity:0}
.cats.waiting .cwrap{cursor:pointer;touch-action:manipulation}
.cats.waiting .cwrap:focus-visible{outline:2px solid var(--gold);outline-offset:6px;border-radius:18px}
/* 一号玩法：哆米去拨 Snowy 的尾巴，Snowy 把尾巴收走 */
.cats.waiting.p1 #fcatD{animation:lean 2.4s ease-in-out infinite}
.cats.waiting.p1 #fcatS .tail{animation:tuck 2.4s ease-in-out infinite}
@keyframes lean{0%,100%{transform:translateX(0)}50%{transform:translateX(-7px) rotate(-3deg)}}
@keyframes tuck{0%,100%{transform:rotate(0)}50%{transform:rotate(-26deg)}}
/* 二号玩法：Snowy 伸懒腰，哆米看着 */
.cats.waiting.p2 #fcatS{animation:stretch 2.6s ease-in-out infinite}
.cats.waiting.p2 #fcatD .head{animation:look 2.6s ease-in-out infinite}
@keyframes stretch{0%,100%{transform:scaleX(1) scaleY(1)}50%{transform:scaleX(1.07) scaleY(.94)}}
@keyframes look{0%,100%{transform:rotate(0)}50%{transform:rotate(-9deg)}}
/* 三号玩法：两只一起望门口 */
.cats.waiting.p3 #fcatS .head,.cats.waiting.p3 #fcatD .head{animation:watch 3s ease-in-out infinite}
.cats.waiting.p3 .fcat .earL,.cats.waiting.p3 .fcat .earR{animation:perk 3s ease-in-out infinite}
@keyframes watch{0%,100%{transform:rotate(0)}45%,55%{transform:rotate(6deg)}}
@keyframes perk{0%,100%{transform:rotate(0)}45%,55%{transform:rotate(-13deg)}}
/* 四号玩法：哆米蹦一下 */
.cats.waiting.p4 #fcatD{animation:hop .7s ease-in-out infinite}
.cats.waiting.p4 #fcatS .tail{animation:fflick 1.1s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.cats.waiting .cline{display:grid;gap:7px;width:min(100%,390px);margin:10px auto 0;text-align:left}
.cline .sp{display:block;width:max-content;max-width:88%;padding:7px 11px;
  border:1px solid var(--line);border-radius:14px 14px 14px 5px;
  background:rgba(255,255,255,.055);box-shadow:0 8px 22px rgba(0,0,0,.12);
  color:#c8d3de;font-size:.78rem;line-height:1.55}
.cline .sp b{display:block;color:var(--gold);font-size:.65rem;letter-spacing:.05em}
.cline .sp.d{justify-self:end;border-radius:14px 14px 5px 14px;background:rgba(217,180,95,.085)}
.cline .sp.d b{color:var(--mint)}
.tapcat{display:block;justify-self:center;color:var(--muted);font-size:.67rem;opacity:.76}

/* 醒着说话时也用气泡，并让两只有点小动作 */
.cats.awake .cline{display:grid;gap:7px;width:min(100%,390px);margin:10px auto 0;text-align:left}
.cats.awake .cwrap{cursor:pointer}
.cats.awake.talking #fcatS .tail{animation:fflick 1.6s ease-in-out infinite}
.cats.awake.talking #fcatD .earR{animation:fearR 2.9s ease-in-out infinite}

/* ── 猫的玩具（老板 2026-08-15：家里坚持越久，玩具攒得越多）──
   玩具只涨不掉：断一天不该把攒下的东西没收。 */
.toys{position:relative;height:0}
.toy{position:absolute;pointer-events:none}
.toy svg{display:block}
/* 蝴蝶：飞过去，猫会看 */
.toy.butterfly{left:-8%;top:-96px;width:26px;animation:flyby 13s linear infinite}
.toy.butterfly .w1{transform-origin:14px 12px;animation:flap .22s ease-in-out infinite alternate}
.toy.butterfly .w2{transform-origin:14px 12px;animation:flap2 .22s ease-in-out infinite alternate}
@keyframes flyby{0%{left:-10%;transform:translateY(0)}25%{transform:translateY(-16px)}
  50%{transform:translateY(8px)}75%{transform:translateY(-12px)}100%{left:106%;transform:translateY(0)}}
@keyframes flap{from{transform:rotateY(0)}to{transform:rotateY(72deg)}}
@keyframes flap2{from{transform:rotateY(0)}to{transform:rotateY(-72deg)}}
/* 毛线球：滚 */
.toy.yarn{left:8%;top:-26px;width:22px;animation:roll 9s ease-in-out infinite}
@keyframes roll{0%,100%{left:6%;transform:rotate(0)}50%{left:74%;transform:rotate(540deg)}}
/* 逗猫棒的羽毛：晃 */
.toy.feather{right:6%;top:-84px;width:20px;transform-origin:10px 0;animation:sway 3.4s ease-in-out infinite}
@keyframes sway{0%,100%{transform:rotate(-16deg)}50%{transform:rotate(16deg)}}
/* 纸团：弹 */
.toy.paper{left:70%;top:-22px;width:17px;animation:bounce 2.6s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-15px)}}
/* 铃铛：抖 */
.toy.bell{left:26%;top:-20px;width:16px;animation:jingle 2.2s ease-in-out infinite}
@keyframes jingle{0%,100%{transform:rotate(-11deg)}50%{transform:rotate(11deg)}}
/* 小鱼干：飘 */
.toy.fish{right:20%;top:-30px;width:20px;animation:bob 4.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-9px) rotate(6deg)}}
.toyline{margin:7px 0 0;font-size:.72rem;color:var(--muted);opacity:.85}
.toyline b{color:var(--gold)}
@media (prefers-reduced-motion:reduce){.toy,.toy *{animation:none !important}}

/* ── 本周搭子（老板 2026-08-15：一星期选一次搭子）──
   搭子的天数只算两个人都来的日子。你不来，我的也没了。 */
.pairs{margin:22px 0 0;padding:16px 16px 15px;background:rgba(255,255,255,.035);
  border:1px solid var(--line);border-radius:16px}
.pb-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.pb-head span:first-child{font-size:.9rem;color:var(--gold);font-weight:700}
.pb-head span:last-child{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pb-tip{margin:0 0 12px;font-size:.8rem;line-height:1.75;color:var(--muted)}
.pr{display:flex;align-items:center;gap:11px;padding:10px 12px;margin-bottom:8px;
  background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:13px}
.pr.strong{border-color:rgba(126,214,178,.4)}
.pr .rank{font-size:.78rem;color:var(--muted);width:16px;font-variant-numeric:tabular-nums}
.pr .nm2{flex:1;font-size:.95rem;font-weight:600}
.pr .nm2 i{font-style:normal;color:var(--muted);margin:0 5px;font-weight:400}
.pr .nm2 .off{opacity:.45}
.pr .dd{text-align:right;font-size:.8rem;color:var(--muted);white-space:nowrap}
.pr.strong .dd{color:var(--mint)}
.pr .dd b{font-size:1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.pk{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.pk .who2{flex-basis:100%;font-size:.76rem;color:var(--muted);margin-top:4px}
.pk button{border:1px solid var(--line);background:rgba(255,255,255,.06);color:var(--ink);
  border-radius:999px;padding:6px 12px;font-size:.8rem;font-family:inherit;cursor:pointer}
.pk button:active{background:rgba(255,255,255,.12)}

.pk .go2{border-color:rgba(217,180,95,.5);background:rgba(217,180,95,.14);color:var(--gold);font-weight:600}
.pk .cancel{opacity:.6}
.pk .wait{opacity:.55;font-size:.76rem}
</style>
</head>
<body>
<div class="wrap">

<header>
  <p class="eyebrow">苏 家</p>
  <h1>今天，谁来了</h1>
  <div class="today"><span>已经来了</span><b id="hereN">—</b><span id="hereTot"></span></div>
</header>

<section class="cats" id="catsBox"><div class="cwrap" id="catStage" role="button" tabindex="0" aria-label="点一下看 Snowy 和哆米继续玩"><svg class="fcat" id="fcatS" viewBox="0 0 200 170" aria-hidden="true">
 <defs><radialGradient id="fgfcatS" cx="42%" cy="34%" r="72%">
  <stop offset="0%" stop-color="#f8f5ef"/><stop offset="100%" stop-color="#e9e3d8"/></radialGradient></defs>
 <g class="tail"><path d="M150 132 C176 130 184 112 176 98 C170 88 158 89 156 98"
   fill="none" stroke="#e9e3d8" stroke-width="13" stroke-linecap="round"/></g>
 <path d="M62 138 C58 108 74 86 100 86 C126 86 142 108 138 138 Z" fill="url(#fgfcatS)"/>
 <ellipse cx="83" cy="140" rx="13" ry="8" fill="#f8f5ef"/><ellipse cx="117" cy="140" rx="13" ry="8" fill="#f8f5ef"/>
 <g class="head">
  <g class="earL"><path d="M70 62 L64 34 L90 50 Z" fill="#e9e3d8"/><path d="M72 58 L69 43 L83 51 Z" fill="#e6b7ae"/></g>
  <g class="earR"><path d="M130 62 L136 34 L110 50 Z" fill="#e9e3d8"/><path d="M128 58 L131 43 L117 51 Z" fill="#e6b7ae"/></g>
  <ellipse cx="100" cy="72" rx="38" ry="33" fill="url(#fgfcatS)"/>
  <path class="shut" d="M79 74 q8 7 16 0" fill="none" stroke="#3a352e" stroke-width="2.6" stroke-linecap="round"/>
  <path class="shut" d="M105 74 q8 7 16 0" fill="none" stroke="#3a352e" stroke-width="2.6" stroke-linecap="round"/>
  <g class="open"><ellipse cx="87" cy="72" rx="7" ry="8.5" fill="#3a352e"/>
   <ellipse cx="113" cy="72" rx="7" ry="8.5" fill="#3a352e"/>
   <circle cx="89.4" cy="69" r="2.4" fill="#fff"/><circle cx="115.4" cy="69" r="2.4" fill="#fff"/></g>
  <path d="M96 85 L104 85 L100 90 Z" fill="#d99a8f"/>
  <g stroke="#3a352e" stroke-width="1.5" stroke-linecap="round" opacity=".38">
   <path d="M70 84 L46 80"/><path d="M70 88 L47 90"/><path d="M130 84 L154 80"/><path d="M130 88 L153 90"/></g>
 </g></svg><svg class="fcat" id="fcatD" viewBox="0 0 200 170" aria-hidden="true">
 <defs><radialGradient id="fgfcatD" cx="42%" cy="34%" r="72%">
  <stop offset="0%" stop-color="#43464f"/><stop offset="100%" stop-color="#2f3138"/></radialGradient></defs>
 <g class="tail"><path d="M150 132 C176 130 184 112 176 98 C170 88 158 89 156 98"
   fill="none" stroke="#2f3138" stroke-width="13" stroke-linecap="round"/></g>
 <path d="M62 138 C58 108 74 86 100 86 C126 86 142 108 138 138 Z" fill="url(#fgfcatD)"/>
 <ellipse cx="83" cy="140" rx="13" ry="8" fill="#43464f"/><ellipse cx="117" cy="140" rx="13" ry="8" fill="#43464f"/>
 <g class="head">
  <g class="earL"><path d="M70 62 L64 34 L90 50 Z" fill="#2f3138"/><path d="M72 58 L69 43 L83 51 Z" fill="#8d6a68"/></g>
  <g class="earR"><path d="M130 62 L136 34 L110 50 Z" fill="#2f3138"/><path d="M128 58 L131 43 L117 51 Z" fill="#8d6a68"/></g>
  <ellipse cx="100" cy="72" rx="38" ry="33" fill="url(#fgfcatD)"/>
  <path class="shut" d="M79 74 q8 7 16 0" fill="none" stroke="#f0e6c8" stroke-width="2.6" stroke-linecap="round"/>
  <path class="shut" d="M105 74 q8 7 16 0" fill="none" stroke="#f0e6c8" stroke-width="2.6" stroke-linecap="round"/>
  <g class="open"><ellipse cx="87" cy="72" rx="7" ry="8.5" fill="#f0e6c8"/>
   <ellipse cx="113" cy="72" rx="7" ry="8.5" fill="#f0e6c8"/>
   <circle cx="89.4" cy="69" r="2.4" fill="#fff8dc"/><circle cx="115.4" cy="69" r="2.4" fill="#fff8dc"/></g>
  <path d="M96 85 L104 85 L100 90 Z" fill="#b07d76"/>
  <g stroke="#f0e6c8" stroke-width="1.5" stroke-linecap="round" opacity=".38">
   <path d="M70 84 L46 80"/><path d="M70 88 L47 90"/><path d="M130 84 L154 80"/><path d="M130 88 L153 90"/></g>
 </g></svg></div><div class="toys" id="toyBox" aria-hidden="true"></div>
<p class="cline" id="catLine" aria-live="polite"></p></section>
<div class="lamp"><i id="lamp"></i></div>

<ul id="list"><li><div class="who"><div class="nm">正在看…</div></div></li></ul>

<section class="pairs" id="pairBox">
  <div class="pb-head"><span>本周搭子</span><span id="pbWeek"></span></div>
  <p class="pb-tip" id="pbTip">正在看…</p>
  <div id="pbList"></div>
  <div id="pbPick"></div>
</section>
<p class="note" id="note"></p>

<footer id="foot"></footer>

</div>

<script>
/* 一家人一起学（老板 2026-08-15 出的主意）
   排名刻意不按数量排——八岁的跟十六岁的比多少，落后那个直接不玩了。
   只看两样：今天来没来、连着多少天没断。这两样各个年纪是公平的。 */
const API="https://yusufs-macbook-pro.tail63c9ae.ts.net";

function chain(n){
  if(n<=0)return "还没开始";
  return "连着 <b>"+n+"</b> 天";
}
function render(d){
  const ps=d.people||[];
  try{renderToys(d.toy)}catch(e){}
  const here=ps.filter(p=>p.here).length, fin=ps.filter(p=>p.finished).length;
  document.getElementById("hereN").textContent=here;
  document.getElementById("hereTot").textContent="／ "+ps.length+" 人";
  document.getElementById("lamp").style.width=(ps.length?here/ps.length*100:0)+"%";

  document.getElementById("list").innerHTML=ps.map(p=>{
    const cls=p.finished?"fin":(p.here?"here":"away");
    const what=p.finished
      ? '<em>今天做完了</em>'
      : (p.here ? p.what+" · 在做" : p.what);
    const right = p.auto
      ? '<div class="cnt">'+(p.here? p.done+" / "+p.total : "—")+'</div>'+
        '<div class="kp">'+chain(p.streak)+'</div>'
      : '<button class="tick'+(p.here?" on":"")+'" data-id="'+p.id+'" data-nm="'+p.name+
        '" data-here="'+(p.here?1:0)+'">'+(p.here?"已打卡":"今天来了")+'</button>'+
        '<div class="kp">'+chain(p.streak)+'</div>';
    /* 点名字进那个人自己的页面。玺雅还没有页面，就不做成链接。 */
    const paw = p.here ? '<svg class="paw" viewBox="0 0 24 24" fill="currentColor" '+
      'style="color:'+(p.finished?'var(--mint)':'var(--gold)')+'">'+
      '<ellipse cx="12" cy="15.5" rx="5.4" ry="4.6"/><ellipse cx="5.6" cy="10.6" rx="2.5" ry="3.1"/>'+
      '<ellipse cx="18.4" cy="10.6" rx="2.5" ry="3.1"/><ellipse cx="9.2" cy="6" rx="2.3" ry="2.9"/>'+
      '<ellipse cx="14.8" cy="6" rx="2.3" ry="2.9"/></svg>' : '';
    const who='<div class="nm">'+p.name+paw+(p.url?'<i class="go">›</i>':'')+'</div>'+
              '<div class="wt">'+what+'</div>';
    const whoBlk = p.url
      ? '<a class="who" href="'+p.url+'">'+who+'</a>'
      : '<div class="who">'+who+'</div>';
    return '<li class="'+cls+'">'+
      '<span class="dot"></span>'+ whoBlk +
      '<div class="right">'+right+'</div>'+
      '</li>';
  }).join("");

  /* 猫跟着今天来了的人。没人来时，两只自己玩、轮流说话。 */
  const tryers=ps.filter(p=>p.here).map(p=>p.name);
  const cb=document.getElementById("catsBox"), cl=document.getElementById("catLine");
  if(!tryers.length){
    catsIdle(cb, cl);      /* 没人来：两只自己玩、自己聊 */
    document.getElementById("note").innerHTML="今天还没人开始。<b>谁先来，谁把灯点上。</b>";
    document.getElementById("foot").textContent=d.date+" · 点名字进各自的页面 · 每分钟自己刷新";
    bindTicks();
    return;                /* 行在上面已经画好了，不用再画 */
  }
  catsActive(cb, cl, ps);   /* 有人来了：猫也说话——夸已经开始的，招呼还没来的 */

  const away=ps.filter(p=>!p.here).map(p=>p.name);
  const note=document.getElementById("note");
  if(!ps.length){ note.textContent=""; }
  else if(!away.length){ note.innerHTML="<b>今天全家都来了。</b>这样的日子不多，记住它。"; }
  else if(here===0){ note.innerHTML="今天还没人开始。<b>谁先来，谁把灯点上。</b>"; }
  else { note.innerHTML="还差 <b>"+away.join("、")+"</b>。别催，去问一句就行。"; }

  /* 没有自己页面的人（玺雅、霏雅、Amina）手动打卡。
     故意加一句确认，免得家里人互相误点。 */
  bindTicks();
  document.getElementById("foot").textContent=d.date+" · 点名字进各自的页面 · 每分钟自己刷新";
}
function bindTicks(){
  [...document.querySelectorAll(".tick")].forEach(b=>{
    b.onclick=async ()=>{
      const on=b.dataset.here==="1", nm=b.dataset.nm;
      if(!confirm(on ? nm+"今天的打卡取消掉？" : nm+"今天学过了吗？")) return;
      b.disabled=true;
      try{
        await fetch(API+"/fam/ping",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({who:b.dataset.id,done:on?0:1,total:1})});
      }catch(e){}
      load();
    };
  });
}
async function load(){
  try{
    const r=await fetch(API+"/fam/board",{cache:"no-store"});
    render(await r.json());
  }catch(e){
    document.getElementById("list").innerHTML=
      '<li><div class="who"><div class="nm">连不上</div><div class="wt">家里的电脑可能没开着</div></div></li>';
  }
}
load(); renderPairs(); setInterval(load,60000); setInterval(renderPairs,60000);
document.addEventListener("visibilitychange",()=>{ if(!document.hidden)load() });

/* ── 没人来的时候，两只自己玩、自己聊（老板 2026-08-15：
      「能不能有一些互动，他们俩之间相互玩耍」「说一些希望家人来参与的一些话」）──
   写的时候按各自性子：Snowy 温和会等，哆米烈、嘴硬心软。
   刻意不写成催——老板自己定过榜上「别催，去问一句就行」。 */
const CHAT=[
 [["哆米","家里今天好安静。"],["Snowy","我们先玩一会儿，等大家回来。"]],
 [["哆米","别晃你那尾巴。"],["Snowy","那你别扑它。"]],
 [["哆米","他们是不是把我们忘了。"],["Snowy","没有。昨天还有人来。"]],
 [["Snowy","今天谁会先来呢。"],["哆米","谁先来，我们就陪谁学五分钟。"]],
 [["哆米","无聊。"],["Snowy","那我陪你玩一会儿。"]],
 [["Snowy","门是不是开了？"],["哆米","……风。"]],
 [["哆米","我数到一百他们还不来，我就睡了。"],["Snowy","你上次数到七就睡了。"]],
 [["Snowy","爸爸、妈妈和孩子们都来就好了。"],["哆米","学什么都行，来了家里就热闹。"]],
 [["哆米","爸爸今天会来吗。"],["Snowy","他忙。忙完会来的。"]],
 [["Snowy","来一个也好。"],["哆米","第一个来的，是把大家等回来的人。"]],
 [["哆米","位置我占着了。"],["Snowy","旁边都给家人留着，快来坐吧。"]],
 [["Snowy","你耳朵动了。"],["哆米","我听见脚步声了……没有。"]],
 [["哆米","要是今天一个都没有呢。"],["Snowy","那我们就等明天。也没什么。"]],
 [["Snowy","我今天特意把毛理了理。"],["哆米","给谁看。"]],
 [["哆米","……给他们看。快来吧。"],["Snowy","嗯，我们一直在。"]]
];
let chatN=0, chatTimer=null, playN=1, catNext=null;
function catsIdle(box, cl){
  if(chatTimer)clearInterval(chatTimer);
  function tick(){
    const pair=CHAT[chatN%CHAT.length]; chatN++;
    playN=(playN%4)+1;
    box.className="cats waiting p"+playN;
    cl.innerHTML=pair.map(function(x){
      return '<span class="sp'+(x[0]==="哆米"?" d":"")+'"><b>'+x[0]+'</b>　'+x[1]+'</span>';
    }).join("")+'<small class="tapcat">点一下小猫，看下一幕</small>';
  }
  catNext=tick;
  tick();
  chatTimer=setInterval(tick,7000);
}
document.getElementById("catStage").addEventListener("click",()=>{
  if(catNext)catNext();
});
document.getElementById("catStage").addEventListener("keydown",e=>{
  if((e.key==="Enter"||e.key===" ")&&catNext&&document.getElementById("catsBox").classList.contains("waiting")){
    e.preventDefault();catNext();
  }
});

/* ── 有人来之后，两只也要说话（老板 2026-08-15：
      「来了之后也让他们有些互动，说一些话鼓励已经开始的人，催还没有来的人」
      他说按我自己的想法来，那我定两条规矩）：
   一、夸人要点名、要具体，不说"你真棒"这种。
   二、招呼没来的人**不许带责备**——老板自己给这榜定过「别催，去问一句就行」。
      所以让猫用猫的办法：去门口等、把位置占着、说想他了。 */
function catsActive(box, cl, ps){
  if(chatTimer)clearInterval(chatTimer);
  const here=ps.filter(p=>p.here), fin=ps.filter(p=>p.finished),
        away=ps.filter(p=>!p.here), doing=here.filter(p=>!p.finished);
  const pick=a=>a[Math.floor(Math.random()*a.length)];
  function lines(){
    const L=[];
    /* 夸做完的 */
    fin.forEach(function(p){
      L.push([["Snowy",p.name+"做完了。今天那份饭我不抢。"],["哆米",p.name+"，干得利索。"]]);
      if(p.streak>=3)L.push([["哆米",p.name+"连着"+p.streak+"天了。"],["Snowy","这个不容易，我记着呢。"]]);
    });
    /* 鼓励正在做的 */
    doing.forEach(function(p){
      L.push([["Snowy",p.name+"在做了，还剩"+(p.total-p.done)+"关。"],["哆米","我盯着，你慢慢来。"]]);
      L.push([["哆米",p.name+"开了头就别停。"],["Snowy","停一下也行，我等着。"]]);
    });
    /* 招呼还没来的 —— 用猫的办法，不带责备 */
    away.forEach(function(p){
      L.push([["哆米",p.name+"还没来。我去门口蹲着。"],["Snowy","位置我给留着呢。"]]);
      L.push([["Snowy","要是"+p.name+"来了，我就去旁边趴着。"],["哆米","那我占另一边。"]]);
    });
    /* 全家到齐 */
    if(!away.length){
      L.push([["Snowy","今天全家都在。"],["哆米","这样的日子不多。我记住了。"]]);
      L.push([["哆米","六个人。忙不过来了。"],["Snowy","那就一人陪一会儿。"]]);
    }
    /* 第一个来的 */
    if(here.length===1){
      L.push([["Snowy",here[0].name+"是今天第一个。"],["哆米","第一个来的，把灯点上了。"]]);
    }
    return L.length? L : [[["Snowy","今天有人来了。"],["哆米","嗯。"]]];
  }
  const pool=lines();
  let n=Math.floor(Math.random()*pool.length);
  function tick(){
    const pair=pool[n%pool.length]; n++;
    cl.innerHTML=pair.map(function(x){
      return '<span class="sp'+(x[0]==="哆米"?" d":"")+'"><b>'+x[0]+'</b>　'+x[1]+'</span>';
    }).join("")+'<small class="tapcat">点一下小猫，看它们再说一句</small>';
  }
  box.className="cats awake talking";
  catNext=tick;
  tick();
  chatTimer=setInterval(tick,7000);
}

/* ── 玩具：全家累计来过多少人次，就攒下多少玩具 ── */
const TOYS=[
 ["yarn","毛线球",'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="#c98b8b"/>'+

function renderToys(toy){
  const box=document.getElementById("toyBox"); if(!box||!toy)return;
  const n=Math.min(toy.toys||0, TOYS.length);
  box.innerHTML=TOYS.slice(0,n).map(function(t){
    return '<div class="toy '+t[0]+'">'+t[2]+'</div>';
  }).join("");
  const cl=document.getElementById("catLine");
  var line=document.getElementById("toyLine");
  if(!line){ line=document.createElement("p"); line.id="toyLine"; line.className="toyline";
             cl.parentNode.appendChild(line) }
  if(n===0){ line.innerHTML="家里一起学满 1 次，两只就有第一个玩具。"; return }
  const names=TOYS.slice(0,n).map(t=>t[1]).join("、");
  line.innerHTML = toy.next
    ? "它们攒到了 <b>"+names+"</b>。全家再学 <b>"+toy.need+"</b> 次，又多一个。"
    : "<b>玩具全齐了。</b>这是全家 "+toy.points+" 次学习攒下来的。";
}

/* ── 本周搭子 ──
   老板：一星期选一次。所以每周一自动翻页，上周的成绩留着。
   双向选中才算成对——A 选 B、B 也选 A。单方面的只算「想约」，
   界面上明说，免得有人以为自己有搭子其实没有。 */
async function renderPairs(){
  const box=document.getElementById("pairBox"); if(!box)return;
  let d;
  try{ d=await (await fetch(API+"/fam/pairs",{cache:"no-store"})).json() }
  catch(e){ document.getElementById("pbTip").textContent="连不上"; return }
  document.getElementById("pbWeek").textContent=d.week||"";
  const L=document.getElementById("pbList"), P=document.getElementById("pbPick");

  document.getElementById("pbTip").innerHTML =
    "搭子的天数<b>只算两个人都来的日子</b>。一个人没来，那天就不算。";

  L.innerHTML=(d.pairs||[]).map(function(p,i){
    const strong=p.weekDays>0;
    return '<div class="pr'+(strong?" strong":"")+'">'+
      '<span class="rank">'+(i+1)+'</span>'+
      '<span class="nm2"><span class="'+(p.aHere?"":"off")+'">'+p.aName+'</span>'+
      '<i>＋</i><span class="'+(p.bHere?"":"off")+'">'+p.bName+'</span></span>'+
      '<span class="dd"><b>'+p.weekDays+'</b> / '+p.weekTotal+' 天</span></div>';
  }).join("") || '<p class="pb-tip" style="margin:0">本周还没有人成对。</p>';

  let html="";
  if((d.asked||[]).length){
    html+='<div class="pk"><span class="who2">还在等对方点头：</span>'+
      d.asked.map(a=>'<button disabled>'+a.aName+' 想约 '+a.bName+'</button>').join("")+'</div>';
  }
  if((d.free||[]).length){
    html+='<div class="pk"><span class="who2">还没选搭子的，点自己的名字去选：</span>'+
      d.free.map(f=>'<button data-me="'+f.id+'" data-nm="'+f.name+'">'+f.name+'</button>').join("")+'</div>';
  }
  P.innerHTML=html;
  /* 老板 2026-08-15 看了截图说「这个界面好丑」——原来用浏览器原生 prompt 弹窗，
     还得手打名字。手机上难用，博远十岁更打不来。改成点两下：
     先点自己，下面就出来能选的人，再点一个，成。 */
  let picking=null;
  function paint(){
    let h="";
    if((d.asked||[]).length){
      h+='<div class="pk"><span class="who2">还在等对方点头：</span>'+
        d.asked.map(a=>'<button class="wait" disabled>'+a.aName+' 想约 '+a.bName+'</button>').join("")+'</div>';
    }
    if(picking){
      const me=(d.free||[]).find(f=>f.id===picking)||{name:""};
      const others=(d.free||[]).filter(f=>f.id!==picking);
      h+='<div class="pk"><span class="who2">'+me.name+'，想跟谁做这周的搭子？</span>'+
        others.map(o=>'<button class="go2" data-pick="'+o.id+'">'+o.name+'</button>').join("")+
        '<button class="cancel" data-cancel="1">算了</button></div>';
    }else if((d.free||[]).length){
      h+='<div class="pk"><span class="who2">还没选搭子的，点自己的名字：</span>'+
        d.free.map(f=>'<button data-me="'+f.id+'">'+f.name+'</button>').join("")+'</div>';
    }
    P.innerHTML=h;
    [...P.querySelectorAll("button[data-me]")].forEach(b=>b.onclick=()=>{picking=b.dataset.me;paint()});
    [...P.querySelectorAll("button[data-cancel]")].forEach(b=>b.onclick=()=>{picking=null;paint()});
    [...P.querySelectorAll("button[data-pick]")].forEach(function(b){
      b.onclick=async function(){
        const me=picking; picking=null;
        b.disabled=true; b.textContent="…";
        await fetch(API+"/fam/pair",{method:"POST",headers:{"Content-Type":"application/json"},
          body:JSON.stringify({who:me,partner:b.dataset.pick})});
        renderPairs();
      };
    });
  }
  paint();
}
</script>
