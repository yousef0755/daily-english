<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声音班子 · The Su Legacy</title>
<style>
:root{--paper:#f5f1e8;--green:#1d4d3b;--green-deep:#143529;--gold:#b8934a;--gold-soft:#d9c294;--muted:#7d766a;--card:#fffdf8}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Helvetica Neue",Georgia,serif;background:var(--paper);color:#1e2b23;line-height:1.6;padding-bottom:40px}
header{background:linear-gradient(160deg,var(--green-deep),var(--green));color:#f2ead8;padding:24px 20px;text-align:center}
header h1{font-size:1.35rem;letter-spacing:.08em}
header p{font-size:.85rem;color:var(--gold-soft);margin-top:6px}
main{max-width:640px;margin:0 auto;padding:18px 16px}
h2{font-size:1rem;color:var(--green-deep);margin:22px 4px 10px;border-bottom:2px solid var(--gold-soft);padding-bottom:6px;letter-spacing:.05em}
h2 small{color:var(--muted);font-weight:400;font-size:.78rem;margin-left:8px}
.v{background:var(--card);border:1px solid #e4dcc9;border-radius:12px;padding:13px 16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.v.star{border-color:var(--gold);box-shadow:0 1px 6px rgba(184,147,74,.25)}
.v .n{font-weight:700;color:var(--green-deep)}
.v .d{font-size:.8rem;color:var(--muted)}
.play{border:1px solid var(--gold);color:var(--green-deep);background:#faf6ea;border-radius:10px;padding:8px 16px;font-size:1rem;cursor:pointer;font-family:inherit;flex-shrink:0}
.play.playing{background:var(--gold);color:#fff}
.tag{display:inline-block;font-size:.72rem;border:1px solid var(--gold-soft);border-radius:10px;padding:1px 8px;margin-left:6px;color:var(--gold);vertical-align:middle}
.note{margin:16px 4px;color:var(--muted);font-size:.85rem;text-align:center}
</style>
</head>
<body>
<header>
  <h1>声音班子</h1>
  <p>老板钦定 · 2026-08-15 定编<br>其余声音已归档，随时可召回</p>
</header>
<main id="main"></main>
<p class="note">调动声音只需一句话 · The Su Legacy</p>
<script>
const SECTIONS=[
 ["小林 · 四国正选",[
  ["zh-CN-liaoning-XiaobeiNeural","晓北","小林中文声 · 东北大妹子","中文",1],
  ["en-US-AriaNeural","Aria","小林英文声 · 自信明亮","English",1],
  ["ar-AE-FatimaNeural","Fatima","小林阿语声 · 阿联酋腔","العربية",1],
  ["tr-TR-EmelNeural","Emel","小林土语声","Türkçe",1]]],
 ["中文组 · 候补一线",[
  ["zh_fr-FR-VivienneMultilingualNeural","Vivienne 说中文","法式慵懒微洋腔","多语",0],
  ["zh_en-US-AvaMultilingualNeural","Ava 说中文","温柔微洋腔","多语",0],
  ["zh-CN-XiaoxiaoNeural","晓晓","标准普通话（SNOWY 现役）","中文",0]]],
 ["英语组 · 在役",[
  ["en-US-AvaNeural","Ava","课本朗读（偶数卡）","US",0],
  ["en-US-JennyNeural","Jenny","课本朗读（奇数卡）","US",0],
  ["en-GB-RyanNeural","Ryan","听力小考官（英音）","UK",0],
  ["en-IE-EmilyNeural","Emily","听力小考官（爱尔兰音）","IE",0],
  ["en-US-AndrewNeural","Andrew","Grok 配音 · 上课外教","US",0],
  ["en-US-BrianNeural","Brian","Codex 配音","US",0]]],
 ["中文男声 · 保留库",[
  ["zh-CN-YunyangNeural","云扬","播音腔","中文",0],
  ["zh-CN-YunxiNeural","云希","清朗","中文",0],
  ["zh-TW-YunJheNeural","云哲","台湾腔温和","中文",0],
  ["zh-CN-YunjianNeural","云健","沉稳老成（Codex中文现役）","中文",0]]],
 ["阿语 · 备用",[
  ["ar-SA-ZariyahNeural","Zariyah","沙特女声","العربية",0],
  ["ar-SA-HamedNeural","Hamed","沙特男声","العربية",0]]]
];
let cur=null,curBtn=null;
const main=document.getElementById("main");
SECTIONS.forEach(([title,voices])=>{
  const h=document.createElement("h2");h.innerHTML=title+(voices[0][4]?'<small>金框的是正选</small>':'');main.appendChild(h);
  voices.forEach(([id,name,desc,tag,star])=>{
    const d=document.createElement("div");d.className="v"+(star?" star":"");
    d.innerHTML='<div><span class="n">'+name+'</span><span class="tag">'+tag+'</span><div class="d">'+desc+'</div></div><button class="play">▶ 听</button>';
    const b=d.querySelector(".play");
    b.onclick=()=>{
      if(cur){cur.pause();if(curBtn){curBtn.classList.remove("playing");curBtn.textContent="▶ 听";}}
      if(curBtn===b&&cur&&!cur.ended){cur=null;curBtn=null;return;}
      cur=new Audio("media/voices/"+id+".mp3");curBtn=b;
      b.classList.add("playing");b.textContent="… 播放中";
      cur.onended=()=>{b.classList.remove("playing");b.textContent="▶ 听";};
      cur.play().catch(()=>{});
    };
    main.appendChild(d);
  });
});
</script>
</body>
</html>
