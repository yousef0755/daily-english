<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>博远的英语 · 今天一课</title>
<style>
  :root{
    --bg0:#0a0e1a; --bg1:#111a2e; --bg2:#0d1424;
    --card:rgba(255,255,255,.045); --card-bd:rgba(255,255,255,.09);
    --ink:#eef2fb; --ink-dim:#9aa8c6; --ink-faint:#5b6a86;
    --gold:#e8b45a; --gold-soft:#f5d9a0;
    --cyan:#5ad1c8; --cyan-soft:#a8ebe5;
    --green:#6fce8f; --line:rgba(255,255,255,.14);
    --shadow:0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,"PingFang SC","Segoe UI",Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 78% -8%, rgba(232,180,90,.10), transparent 55%),
      radial-gradient(1000px 620px at 12% 108%, rgba(90,209,200,.10), transparent 55%),
      linear-gradient(168deg,var(--bg0),var(--bg1) 52%,var(--bg2));
    background-attachment:fixed;
    min-height:100vh; line-height:1.6;
    padding:22px 16px 60px;
  }
  .wrap{max-width:620px;margin:0 auto}

  header{text-align:center;margin:6px 0 22px}
  .eyebrow{font-size:12.5px;letter-spacing:.3em;color:var(--gold);text-transform:uppercase;font-weight:600}
  h1{font-size:26px;margin:9px 0 4px;font-weight:700;letter-spacing:.01em}
  .subtitle{font-size:15px;color:var(--ink-dim)}
  .datechip{display:inline-block;margin-top:12px;font-size:12.5px;color:var(--ink-dim);
    border:1px solid var(--card-bd);border-radius:999px;padding:5px 14px;background:var(--card)}

  .unitbar{display:flex;gap:7px;overflow-x:auto;padding:14px 2px 2px;-webkit-overflow-scrolling:touch}
  .unitbar::-webkit-scrollbar{display:none}
  .ub{flex:none;font-size:12.5px;padding:6px 12px;border-radius:999px;cursor:pointer;
    border:1px solid var(--card-bd);background:var(--card);color:var(--ink-dim);white-space:nowrap}
  .ub.today{border-color:rgba(232,180,90,.55);color:var(--gold-soft);font-weight:600}
  .ub.on{background:linear-gradient(160deg,rgba(232,180,90,.25),rgba(232,180,90,.08));
    border-color:var(--gold);color:var(--ink);font-weight:700}
  .steps{display:flex;gap:8px;margin:22px 0 8px}
  .step-tab{flex:1;text-align:center;font-size:13px;padding:9px 4px;border-radius:12px;
    border:1px solid var(--card-bd);background:var(--card);color:var(--ink-dim);font-weight:600;
    cursor:pointer;transition:.2s}
  .step-tab .num{display:block;font-size:11px;color:var(--gold);letter-spacing:.1em;margin-bottom:2px}
  .step-tab.on{background:linear-gradient(160deg,rgba(232,180,90,.20),rgba(232,180,90,.06));
    border-color:rgba(232,180,90,.4);color:var(--ink)}

  section{margin-top:20px}
  .sec-head{display:flex;align-items:baseline;gap:10px;margin:0 2px 14px}
  .sec-head .idx{font-size:13px;color:var(--gold);font-weight:700;letter-spacing:.14em}
  .sec-head h2{font-size:18px;margin:0;font-weight:700}
  .sec-head .hint{font-size:12.5px;color:var(--ink-dim);margin-left:auto}

  .listen-all{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;
    border:1px solid rgba(90,209,200,.35);background:linear-gradient(160deg,rgba(90,209,200,.14),rgba(90,209,200,.04));
    color:var(--cyan-soft);font-size:14.5px;font-weight:600;border-radius:14px;padding:13px;margin-bottom:14px;cursor:pointer}
  .listen-all svg{flex:none;width:19px;height:19px}
  .listen-all:active{transform:scale(.99)}

  .cards{display:flex;flex-direction:column;gap:11px}
  .card{position:relative;display:flex;align-items:center;gap:14px;
    background:var(--card);border:1px solid var(--card-bd);border-radius:16px;
    padding:15px 16px;box-shadow:var(--shadow);cursor:pointer;transition:.15s;overflow:hidden}
  .card:active{transform:scale(.994);background:rgba(255,255,255,.07)}
  .card .n{position:absolute;top:9px;right:13px;font-size:12px;color:var(--ink-faint);opacity:.5}
  .card .play{flex:none;width:46px;height:46px;border-radius:50%;
    background:linear-gradient(155deg,var(--gold),#c9923c);color:#1a1206;
    display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(232,180,90,.3)}
  .card .play svg{width:20px;height:20px;margin-left:2px}
  .card.playing .play{background:linear-gradient(155deg,var(--cyan),#2f9d95);color:#04201d;
    box-shadow:0 6px 18px rgba(90,209,200,.45)}
  .card .body{flex:1;min-width:0}
  .card .word{font-size:30px;font-weight:800;letter-spacing:.01em;line-height:1.15;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .card .ipa{font-size:14px;color:var(--cyan-soft);font-family:"Times New Roman",serif;margin-top:1px}
  .card .meta{font-size:14.5px;color:var(--ink-dim);margin-top:3px}
  .card .pos{color:var(--gold-soft);font-style:italic;margin-right:6px;font-size:13px}
  .tag-read{font-size:11px;font-weight:600;letter-spacing:.05em;color:var(--cyan-soft);
    border:1px solid rgba(90,209,200,.4);background:rgba(90,209,200,.1);border-radius:999px;
    padding:2px 9px;vertical-align:middle}

  .sentences{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .sent{display:flex;align-items:center;gap:12px;background:rgba(90,209,200,.06);
    border:1px solid rgba(90,209,200,.18);border-radius:14px;padding:12px 15px;cursor:pointer}
  .sent .sp{flex:none;width:34px;height:34px;border-radius:50%;background:rgba(90,209,200,.16);
    display:flex;align-items:center;justify-content:center;color:var(--cyan-soft)}
  .sent .sp svg{width:16px;height:16px;margin-left:1px}
  .sent .en{font-size:16.5px;font-weight:600}
  .sent .cn{font-size:13px;color:var(--ink-dim);margin-top:1px}

  .note-star{font-size:12.5px;color:var(--ink-dim);margin-top:14px;padding:10px 13px;
    border-left:2px solid rgba(90,209,200,.4);background:rgba(90,209,200,.05);border-radius:0 10px 10px 0}

  .write-list{display:flex;flex-direction:column;gap:16px}
  .write-row .wlabel{font-size:14px;color:var(--ink-dim);margin:0 2px 6px}
  .write-row .wlabel b{color:var(--ink);font-size:16px;font-weight:700}
  .fourline{position:relative;height:64px;border-radius:12px;background:rgba(255,255,255,.03);
    border:1px solid var(--card-bd);overflow:hidden}
  .fourline .l{position:absolute;left:0;right:0;height:1px;background:var(--line)}
  .fourline .l.dash{border-top:1px dashed rgba(255,255,255,.22);background:none;height:0}
  .fourline .l.mid{background:rgba(232,180,90,.32)}
  .fourline .trace{position:absolute;left:16px;top:50%;transform:translateY(-50%);
    font-family:"Times New Roman",serif;font-size:36px;letter-spacing:.06em;
    color:rgba(255,255,255,.14);font-weight:400;user-select:none}
  .spellbox{margin-top:8px;display:flex;gap:8px;align-items:center}
  .spellbox input{flex:1;background:rgba(255,255,255,.05);border:1px solid var(--card-bd);
    border-radius:10px;padding:11px 14px;color:var(--ink);font-size:17px;
    font-family:"Times New Roman",serif;letter-spacing:.04em;outline:none}
  .spellbox input:focus{border-color:rgba(232,180,90,.5)}
  .spellbox .mark{flex:none;width:44px;text-align:center;font-size:20px}
  .spellbox .mark.ok{color:var(--green)}
  .spellbox .mark.try{color:var(--gold);font-size:13px}

  .diary-card{background:var(--card);border:1px solid var(--card-bd);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
  .diary-words{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .diary-words .w{font-size:13.5px;padding:5px 11px;border-radius:999px;
    background:rgba(232,180,90,.12);border:1px solid rgba(232,180,90,.28);color:var(--gold-soft);cursor:pointer}
  .diary-card textarea{width:100%;min-height:110px;resize:vertical;background:rgba(255,255,255,.03);
    border:1px solid var(--card-bd);border-radius:12px;padding:13px;color:var(--ink);
    font-size:16px;line-height:1.7;outline:none;font-family:inherit}
  .diary-card textarea:focus{border-color:rgba(232,180,90,.5)}
  .diary-foot{display:flex;align-items:center;gap:12px;margin-top:12px}
  .diary-foot .save{border:1px solid rgba(111,206,143,.4);background:rgba(111,206,143,.12);
    color:var(--green);font-size:14.5px;font-weight:600;border-radius:12px;padding:11px 22px;cursor:pointer}
  .diary-foot .saved{font-size:13px;color:var(--ink-dim)}
  .example{font-size:13px;color:var(--ink-dim);margin-top:10px;font-style:italic}

  footer{text-align:center;margin-top:34px;font-size:12px;color:var(--ink-faint);opacity:.6}

  /* ── 点字显隐 / 已背会 / 当天打卡（老板 8-19 截图版式）── */
  .card .hidable{transition:filter .15s}
  .card.veiled .hidable{filter:blur(9px);user-select:none}
  .card{flex-wrap:wrap}
  .cardops{display:flex;flex-direction:row;gap:10px;flex:1 0 100%;margin-top:10px;padding-left:60px}
  .cardops button{flex:1;border:1px solid var(--card-bd);background:rgba(255,255,255,.05);
    border-radius:12px;padding:10px 0;font-size:14px;color:var(--ink);cursor:pointer;
    white-space:nowrap;font-weight:600}
  .cardops .op-listen{font-weight:600}
  .card.known .op-mem{background:#3d6b4f;border-color:#3d6b4f;color:#f2efe6}
  .card.known{outline:2px solid rgba(61,107,79,.55);outline-offset:-1px}
  .daydone{margin-top:26px;padding:16px;border:1px solid rgba(120,130,120,.3);
    border-radius:16px;text-align:center}
  .dd-hint{font-size:14px;margin-bottom:12px;opacity:.85}
  .dd-btn{width:100%;border:0;border-radius:14px;padding:15px;font-size:16.5px;font-weight:700;
    background:#7d928a;color:#fff;cursor:pointer}
  .dd-btn:disabled{opacity:.45;cursor:default}
  .dd-btn.dd-done{background:#3d6b4f;opacity:1}
  .sec-hidden{display:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow" id="eyebrow">Unit 9</div>
    <h1 id="title">May I have a pie?</h1>
    <div class="subtitle" id="subtitle">今天的单词</div>
    <div class="datechip" id="datechip">今天</div>
    <div class="unitbar" id="unitbar"></div>
  </header>

  <div class="steps">
    <div class="step-tab on" data-go="s1"><span class="num">STEP 1</span>听 & 读</div>
    <div class="step-tab" data-go="s2"><span class="num">STEP 2</span>写一遍</div>
    <div class="step-tab" data-go="s3"><span class="num">STEP 3</span>写日记</div>
  </div>

  <section id="s1">
    <div class="sec-head"><span class="idx">01</span><h2>先听，再跟着读</h2><span class="hint">点单词就会念</span></div>
    <button class="listen-all" id="listenAll">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 00-2.5-4v8a4.5 4.5 0 002.5-4z"/></svg>
      听一遍整课（原声朗读）
    </button>
    <div class="cards" id="cards"></div>
    <div class="sentences" id="sentences"></div>
    <div class="note-star" id="noteStar"></div>
  </section>

  <section id="s2" class="sec-hidden">
    <div class="sec-head"><span class="idx">02</span><h2>照着写一遍</h2><span class="hint">四线格里，先描后写</span></div>
    <div class="write-list" id="writeList"></div>
  </section>

  <section id="s3" class="sec-hidden">
    <div class="sec-head"><span class="idx">03</span><h2>用今天的词，写一句话</h2><span class="hint">写你自己的事</span></div>
    <div class="diary-card">
      <div class="diary-words" id="diaryWords"></div>
      <textarea id="diary" placeholder="用上今天学的一个词，写一句英文。写你今天吃了什么、想要什么都行。"></textarea>
      <div class="diary-foot">
        <button class="save" id="saveDiary">保存</button>
        <span class="saved" id="savedMsg"></span>
      </div>
      <div class="example" id="example"></div>
    </div>
  </section>

  <!-- 当天完成（老板 8-19 凌晨截图定样式：底部一条，背会才点得动） -->
  <div class="daydone" id="dayDone">
    <div class="dd-hint" id="ddHint">四个单词都点了「已背会」，就可以打卡。(0/4)</div>
    <button class="dd-btn" id="ddBtn" disabled>今天的单词我都会了 — 打卡</button>
  </div>

  <footer>博远的英语 · 每天一课 · 一家人一起学</footer>
</div>

/* 排课：从 2026-08-19 起每天一课，按书的顺序走；学完最后一课就停在最后一课。
   要看别的课：网址后面加 ?unit=2u5 这样的钥匙（也方便复习）。 */
const SCHEDULE = ['1u11', '2u1', '2u2', '2u3', '2u4', '2u5', '2u6', '2u7', '2u8', '2u9', '2u10', '2u11', '2u12'];
const ANCHOR = "2026-08-19";
function dubaiDate(){ return new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dubai'}); }
function pickToday(){
  const q = new URLSearchParams(location.search).get('unit');
  if(q && UNITS[q]) return q;
  const days = Math.max(0, Math.round((new Date(dubaiDate()) - new Date(ANCHOR)) / 86400000));
  return SCHEDULE[Math.min(days, SCHEDULE.length - 1)];
}
const TODAY = pickToday();

/* 课程表栏：整本都排在这儿，点哪课学哪课；不带参数就是今天的课 */
(function(){
  const bar=document.getElementById('unitbar');
  if(!bar) return;
  const days=Math.max(0,Math.round((new Date(dubaiDate())-new Date(ANCHOR))/86400000));
  const todayKey=SCHEDULE[Math.min(days,SCHEDULE.length-1)];
  SCHEDULE.forEach(k=>{
    const u=UNITS[k]; if(!u) return;
    const b=document.createElement('div');
    b.className='ub'+(k===TODAY?' on':'')+(k===todayKey?' today':'');
    b.textContent=(k===todayKey?'今天 · ':'')+'U'+u.unit+' '+u.title;
    b.onclick=()=>{ location.search = (k===todayKey) ? '' : ('?unit='+k); };
    bar.appendChild(b);
  });
})();
const U = UNITS[TODAY];
const AUDIO_DIR = "boyuan-audio/";
const SPK='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 9v6h4l5 5V4L7 9H3z"/></svg>';

/* 头部 */
document.getElementById('eyebrow').textContent = `${U.volume} · Unit ${U.unit} · 第 ${U.page} 页`;
document.getElementById('title').textContent = U.title;
document.getElementById('example').textContent = U.example || '';
document.getElementById('datechip').textContent =
  new Date().toLocaleDateString('zh-CN',{month:'long',day:'numeric',weekday:'long'});

/* 播放 */
let curAudio=null, curCard=null, failCount=0, tipTimer=null;

/* 没响就说一声。原来这里是两个空的 catch，坏了也不出声——
   孩子按下去没反应，只会以为是自己按得不对，一遍遍按。 */
function sayTip(msg){
  let el=document.getElementById('audioTip');
  if(!el){
    el=document.createElement('div'); el.id='audioTip';
    el.setAttribute('role','status'); el.setAttribute('aria-live','polite');
    el.style.cssText='position:fixed;left:50%;bottom:24px;transform:translateX(-50%);'
      +'width:max-content;max-width:86%;padding:12px 18px;border-radius:14px;z-index:99;'
      +'background:rgba(28,34,30,.94);color:#f2efe6;font-size:15px;line-height:1.6;'
      +'box-shadow:0 8px 28px rgba(0,0,0,.28);text-align:center;'
      +'opacity:1;transition:opacity .18s';
    document.body.appendChild(el);
  }
  el.textContent=msg;
  /* 出现这件事不许依赖动画。
     rAF 在后台标签页不跑；CSS 过渡在后台标签页也是冻的——
     一旦「从透明淡进来」是唯一的显示路径，冻住就等于没提示。
     所以它生下来就是可见的，过渡只负责淡出。 */
  el.style.opacity='1';
  clearTimeout(tipTimer);
  tipTimer=setTimeout(()=>{el.style.opacity='0'}, 4200);
}

function playFailed(cardEl, au){
  /* onerror 和 play().catch() 会为同一次失败各响一遍。
     不挡住的话，第一次没响就直接说成「还是没响」。 */
  if(au){ if(au.__told) return; au.__told=1; }
  if(cardEl) cardEl.classList.remove('playing');
  failCount++;
  sayTip(failCount<2 ? '这个音没响。再点一次。'
                     : '还是没响，多半是网慢了。等一会儿再点，先往下念。');
}

function play(src, cardEl){
  try{
    if(curAudio){ curAudio.onerror=null; curAudio.pause(); }
    if(curCard) curCard.classList.remove('playing');
    curAudio=new Audio(src); curCard=cardEl||null;
    if(cardEl) cardEl.classList.add('playing');
    const au=curAudio;
    au.onerror=()=>playFailed(cardEl,au);          /* 文件不在、名字对不上 */
    curAudio.play().then(()=>{failCount=0})           /* 响了就把计数清零 */
                   .catch(()=>playFailed(cardEl,au));    /* 浏览器拦了、或者没声源 */
    curAudio.onended=()=>{ if(cardEl) cardEl.classList.remove('playing'); };
  }catch(e){ playFailed(cardEl); }
}

/* STEP1 单词卡 */
const cardsEl=document.getElementById('cards');
U.words.forEach(w=>{
  const d=document.createElement('div'); d.className='card';
  const readTag = w.star ? '<span class="tag-read">只认读</span>' : '';
  const egHtml = w.eg
    ? `<div class="weg" style="margin-top:9px;padding:8px 10px;border-left:3px solid #b08d3e;
         background:rgba(176,141,62,.08);border-radius:6px;
         display:flex;gap:8px;align-items:flex-start;cursor:pointer">
         <div class="sp" style="flex:0 0 auto;width:18px;opacity:.75;margin-top:1px">${SPK}</div>
         <div><div class="en hidable" style="font-size:13.5px">${w.eg.en}</div>
              <div class="cn hidable" style="font-size:12px;opacity:.72">${w.eg.zh}</div></div>
       </div>`
    : '';
  d.innerHTML=`<span class="n">${w.n}</span>
    <div class="play">${SPK}</div>
    <div class="body">
      <div class="word hidable">${w.w}${readTag}</div>
      <div class="ipa hidable">${w.ipa}</div>
      <div class="meta hidable"><span class="pos">${w.pos}</span>${w.zh}</div>
      ${egHtml}
    </div>
    <div class="cardops">
      <button class="op-listen" type="button">▶ 听</button>
      <button class="op-mem" type="button">已背会</button>
    </div>`;
  /* 点字面：显示/隐藏（蒙住，凭记忆背；再点回来对答案）——老板 8-19 定的样式 */
  d.querySelector('.body').onclick=(ev)=>{
    if(ev.target.closest('.weg')) return;
    d.classList.toggle('veiled');
  };
  /* 听：先念单词，跟着念它的句子 */
  d.querySelector('.op-listen').onclick=(ev)=>{
    ev.stopPropagation();
    play(AUDIO_DIR+TODAY+'_'+w.f+'.mp3', d);
    if(curAudio) curAudio.onended=()=>{ d.classList.remove('playing'); play(AUDIO_DIR+TODAY+'_'+w.f+'_s.mp3', d); };
  };
  const egEl=d.querySelector('.weg');
  if(egEl) egEl.onclick=(ev)=>{ ev.stopPropagation(); play(AUDIO_DIR+TODAY+'_'+w.f+'_s.mp3', d); };
  /* 已背会：点亮记一笔，攒齐了才放打卡 */
  d.querySelector('.op-mem').onclick=(ev)=>{
    ev.stopPropagation();
    d.classList.toggle('known');
    memMark(w.w, d.classList.contains('known'));
  };
  cardsEl.appendChild(d);
});
document.getElementById('listenAll').onclick=()=>play(AUDIO_DIR+TODAY+'_lesson.mp3',null);

/* ===== 已背会 + 当天打卡（照老板 8-19 截图的样子）=====
   日期一律按迪拜算；背会名单和打卡各记一条，按天分开，不清昨天的账 */
const dxb = new Date().toLocaleDateString('en-CA',{timeZone:'Asia/Dubai'});
const MEMK='boyuanEnMem_'+dxb, DONEK='boyuanEnDone_'+dxb;
let memSet;
try{ memSet=new Set(JSON.parse(localStorage.getItem(MEMK)||'[]')); }catch(e){ memSet=new Set(); }
function memMark(w,on){
  if(on) memSet.add(w); else memSet.delete(w);
  try{ localStorage.setItem(MEMK, JSON.stringify([...memSet])); }catch(e){}
  ddPaint();
}
function ddPaint(){
  const total=U.words.length, got=[...memSet].filter(w=>U.words.some(x=>x.w===w)).length;
  const hint=document.getElementById('ddHint'), btn=document.getElementById('ddBtn');
  const done=localStorage.getItem(DONEK)==='1';
  if(done){
    hint.textContent='今天的单词全背会了。';
    btn.textContent='今天打卡完成 ✓'; btn.disabled=true; btn.classList.add('dd-done');
    return;
  }
  hint.textContent=(got<total)
    ? `四个单词都点了「已背会」，就可以打卡。(${got}/${total})`
    : '都背会了——点下面打卡。';
  btn.disabled=(got<total);
}
document.getElementById('ddBtn').onclick=()=>{
  try{ localStorage.setItem(DONEK,'1'); }catch(e){}
  ddPaint();
  sayTip('打卡完成。明天见。');
};
/* 恢复今天已点过的背会状态 */
setTimeout(()=>{
  document.querySelectorAll('#cards .card').forEach((c,i)=>{
    const w=U.words[i];
    if(w && memSet.has(w.w)) c.classList.add('known');
  });
  ddPaint();
},0);

/* 重点句 */
const sentsEl=document.getElementById('sentences');
U.sentences.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='sent';
  d.innerHTML=`<div class="sp">${SPK}</div><div><div class="en">${s.en}</div><div class="cn">${s.zh}</div></div>`;
  d.onclick=()=>play(AUDIO_DIR+TODAY+'_sent'+(i+1)+'.mp3',null);
  sentsEl.appendChild(d);
});

/* 星号说明 */
const stars=U.words.filter(w=>w.star).map(w=>w.w);
document.getElementById('noteStar').innerHTML = stars.length
  ? `带「只认读」的词（${stars.join('、')}）：会念、认得就好，这两个不用写。`
  : '';
if(!stars.length) document.getElementById('noteStar').style.display='none';

/* STEP2 写一遍（跳过只认读的词） */
const wl=document.getElementById('writeList');
U.words.filter(w=>!w.star).forEach(w=>{
  const row=document.createElement('div'); row.className='write-row';
  row.innerHTML=`
    <div class="wlabel"><b>${w.w}</b> &nbsp;${w.zh}</div>
    <div class="fourline">
      <div class="l" style="top:16%"></div>
      <div class="l dash" style="top:38%"></div>
      <div class="l mid" style="top:62%"></div>
      <div class="l" style="top:84%"></div>
      <div class="trace">${w.w}</div>
    </div>
    <div class="spellbox">
      <input type="text" placeholder="在这里也打一遍" autocomplete="off" autocapitalize="off" spellcheck="false" data-w="${w.w}">
      <span class="mark"></span>
    </div>`;
  wl.appendChild(row);
});
wl.querySelectorAll('.spellbox input').forEach(inp=>{
  inp.addEventListener('input',()=>{
    const mark=inp.parentElement.querySelector('.mark');
    const v=inp.value.trim().toLowerCase(), t=inp.dataset.w.toLowerCase();
    if(!v){mark.className='mark';mark.textContent='';}
    else if(v===t){mark.className='mark ok';mark.textContent='✓';}
    else if(t.startsWith(v)){mark.className='mark';mark.textContent='';}
    else {mark.className='mark try';mark.textContent='再看看';}
  });
});

/* STEP3 日记（全部词都能用，含只认读的） */
const dw=document.getElementById('diaryWords');
const diary=document.getElementById('diary');
U.words.forEach(w=>{
  const chip=document.createElement('span'); chip.className='w'; chip.textContent=w.w;
  chip.onclick=()=>{ const s=diary.selectionStart||diary.value.length;
    diary.value=diary.value.slice(0,s)+(s&&diary.value[s-1]!==' '?' ':'')+w.w+' '+diary.value.slice(s);
    diary.focus(); };
  dw.appendChild(chip);
});
const KEY='boyuan_diary_'+TODAY;
const savedVal=localStorage.getItem(KEY);
if(savedVal){ diary.value=savedVal; document.getElementById('savedMsg').textContent='上次写的还在'; }
document.getElementById('saveDiary').onclick=()=>{
  localStorage.setItem(KEY,diary.value);
  document.getElementById('savedMsg').textContent='保存好了 ✓';
};

/* 步骤切换 */
document.querySelectorAll('.step-tab').forEach(tab=>{
  tab.onclick=()=>{
    document.querySelectorAll('.step-tab').forEach(t=>t.classList.remove('on'));
    tab.classList.add('on');
    ['s1','s2','s3'].forEach(id=>document.getElementById(id).classList.add('sec-hidden'));
    document.getElementById(tab.dataset.go).classList.remove('sec-hidden');
    window.scrollTo({top:0,behavior:'smooth'});
  };
});
</script>
