<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>诗语小园 · Feiya</title>
<style>
:root{--bg:#f7f3ea;--card:#fffdf8;--ink:#2f2a24;--sub:#8a7f6e;--zhu:#b5432f;--mo:#4a4238;--line:#e8e0d0}
@media(prefers-color-scheme:dark){:root{--bg:#211d18;--card:#2b261f;--ink:#efe8da;--sub:#a2947e;--zhu:#d96a52;--mo:#c9bda9;--line:#3d362c}}
*{margin:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.8 "Songti SC","Noto Serif SC",serif;padding:22px 16px 70px}
.wrap{max-width:480px;margin:0 auto}
header{text-align:center;margin-bottom:18px}
h1{font-size:26px;letter-spacing:6px;font-weight:700}
.date{color:var(--sub);font-size:13px;margin-top:4px;letter-spacing:1px}
.tabs{display:flex;gap:8px;justify-content:center;margin:16px 0}
.tab{border:1px solid var(--line);background:var(--card);color:var(--sub);padding:7px 18px;border-radius:20px;font:inherit;font-size:14px;cursor:pointer}
.tab.on{background:var(--zhu);border-color:var(--zhu);color:#fff}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px 20px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.tag{display:inline-block;font-size:11px;letter-spacing:2px;color:var(--zhu);border:1px solid var(--zhu);border-radius:4px;padding:1px 8px;margin-bottom:10px}
.ptitle{font-size:20px;font-weight:700;margin-bottom:2px}
.pauthor{color:var(--sub);font-size:13px;margin-bottom:12px}
.plines{font-size:18px;line-height:2.15;letter-spacing:1px}
.meaning{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);color:var(--mo);font-size:14.5px}
.meaning b{color:var(--zhu);font-weight:700}
.idiom-word{font-size:24px;font-weight:700;letter-spacing:8px;margin-bottom:8px}
.learnrow{margin-top:14px;display:flex;align-items:center;justify-content:space-between}
.learnbtn{border:1.5px solid var(--zhu);background:transparent;color:var(--zhu);border-radius:20px;padding:6px 16px;font:inherit;font-size:14px;cursor:pointer}
.learnbtn.done{background:var(--zhu);color:#fff}
.prog{color:var(--sub);font-size:13px}
.listwrap{display:none}
.li{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:8px;cursor:pointer}
.li .no{color:var(--sub);font-size:12px;width:22px}
.li .nm{flex:1;font-size:15.5px}
.li .st{font-size:12px;color:var(--sub)}
.li.done .nm{color:var(--sub)}
.li.done .st{color:var(--zhu)}
footer{text-align:center;color:var(--sub);font-size:12.5px;margin-top:22px;letter-spacing:1px}

.famlink{display:inline-flex;align-items:center;justify-content:center;min-height:44px;
  margin-top:10px;padding:9px 15px;border-radius:999px;
  border:1px solid rgba(0,0,0,.14);background:rgba(255,255,255,.5);
  font-size:.85rem;font-weight:700;color:inherit;text-decoration:none}


/* 返回键跟着滚（老板：进去之后要能回得来）。位置样式用 Jay 那版，只补 sticky。 */
.famlink{position:sticky;top:8px;z-index:60}
@supports(padding:max(0px)){ .famlink{top:max(8px, env(safe-area-inset-top))} }
</style>

<header>
  <h1>诗语小园</h1>

<script>
const POEMS=[
{t:"静夜思",a:"李白 · 唐",l:["床前明月光，疑是地上霜。","举头望明月，低头思故乡。"],m:"深夜看见月光想起家乡。",u:"在外地想家的晚上，抬头看到月亮，就是这首诗的心情。"},
{t:"春晓",a:"孟浩然 · 唐",l:["春眠不觉晓，处处闻啼鸟。","夜来风雨声，花落知多少。"],m:"春天睡得沉，醒来听见鸟叫，想起夜里的风雨。",u:"春天赖床听见窗外鸟叫时，可以来一句「春眠不觉晓」。"},
{t:"登鹳雀楼",a:"王之涣 · 唐",l:["白日依山尽，黄河入海流。","欲穷千里目，更上一层楼。"],m:"想看得更远，就要站得更高。",u:"鼓励自己或朋友再进一步时：「欲穷千里目，更上一层楼」。"},
{t:"相思",a:"王维 · 唐",l:["红豆生南国，春来发几枝。","愿君多采撷，此物最相思。"],m:"借红豆寄托思念。",u:"送朋友红豆或纪念小物时，配这句最有心意。"},
{t:"悯农",a:"李绅 · 唐",l:["锄禾日当午，汗滴禾下土。","谁知盘中餐，粒粒皆辛苦。"],m:"粮食来之不易。",u:"提醒自己别浪费食物，光盘的时候想起它。"},
{t:"咏鹅",a:"骆宾王 · 唐",l:["鹅，鹅，鹅，曲项向天歌。","白毛浮绿水，红掌拨清波。"],m:"七岁写的咏鹅诗，画面感十足。",u:"公园看到鹅或鸭子，随口就能背，气氛立刻可爱。"},
{t:"江雪",a:"柳宗元 · 唐",l:["千山鸟飞绝，万径人踪灭。","孤舟蓑笠翁，独钓寒江雪。"],m:"天地寂静，一人独钓，孤而不冷的境界。",u:"一个人也把事情做得认真漂亮时，就是「独钓寒江雪」的劲头。"},
{t:"寻隐者不遇",a:"贾岛 · 唐",l:["松下问童子，言师采药去。","只在此山中，云深不知处。"],m:"找人未遇，只知在山中云深处。",u:"朋友问你人在哪、事情进展如何还说不准时：「云深不知处」。"},
{t:"清明",a:"杜牧 · 唐",l:["清明时节雨纷纷，路上行人欲断魂。","借问酒家何处有？牧童遥指杏花村。"],m:"清明细雨中的行路与问询。",u:"清明前后下小雨，这句几乎是标配。"},
{t:"山行",a:"杜牧 · 唐",l:["远上寒山石径斜，白云生处有人家。","停车坐爱枫林晚，霜叶红于二月花。"],m:"秋天的枫叶比春花还红。",u:"秋游看红叶拍照，配文就用「霜叶红于二月花」。"},
{t:"枫桥夜泊",a:"张继 · 唐",l:["月落乌啼霜满天，江枫渔火对愁眠。","姑苏城外寒山寺，夜半钟声到客船。"],m:"旅途夜泊的清冷与钟声。",u:"夜里失眠听见远处声音，就懂什么叫「夜半钟声到客船」。"},
{t:"望庐山瀑布",a:"李白 · 唐",l:["日照香炉生紫烟，遥看瀑布挂前川。","飞流直下三千尺，疑是银河落九天。"],m:"瀑布壮观如银河落下。",u:"看到瀑布或大场面，「飞流直下三千尺」脱口而出最提气。"},
{t:"早发白帝城",a:"李白 · 唐",l:["朝辞白帝彩云间，千里江陵一日还。","两岸猿声啼不住，轻舟已过万重山。"],m:"顺风顺水，一日千里。",u:"事情办得特别顺、难关一口气全过时：「轻舟已过万重山」。"},
{t:"黄鹤楼送孟浩然之广陵",a:"李白 · 唐",l:["故人西辞黄鹤楼，烟花三月下扬州。","孤帆远影碧空尽，唯见长江天际流。"],m:"送别友人，目送到帆影消失。",u:"送朋友远行，机场目送时就是「孤帆远影碧空尽」。"},
{t:"九月九日忆山东兄弟",a:"王维 · 唐",l:["独在异乡为异客，每逢佳节倍思亲。","遥知兄弟登高处，遍插茱萸少一人。"],m:"过节时最想家。",u:"在国外过春节中秋，发家人群就配「每逢佳节倍思亲」。"},
{t:"泊船瓜洲",a:"王安石 · 宋",l:["京口瓜洲一水间，钟山只隔数重山。","春风又绿江南岸，明月何时照我还？"],m:"一个「绿」字写活了春天，又问归期。",u:"春天来了、又想回家，两种心情一句全有。"},
{t:"题西林壁",a:"苏轼 · 宋",l:["横看成岭侧成峰，远近高低各不同。","不识庐山真面目，只缘身在此山中。"],m:"身在局中反而看不清全貌。",u:"劝人跳出问题看问题：「不识庐山真面目，只缘身在此山中」。"},
{t:"小池",a:"杨万里 · 宋",l:["泉眼无声惜细流，树阴照水爱晴柔。","小荷才露尖尖角，早有蜻蜓立上头。"],m:"初夏小池的灵动一瞬。",u:"夸小朋友或新人刚崭露头角：「小荷才露尖尖角」。"},
{t:"晓出净慈寺送林子方",a:"杨万里 · 宋",l:["毕竟西湖六月中，风光不与四时同。","接天莲叶无穷碧，映日荷花别样红。"],m:"六月西湖的荷花盛景。",u:"夏天看到成片荷花，就是「映日荷花别样红」。"},
{t:"绝句",a:"杜甫 · 唐",l:["两个黄鹂鸣翠柳，一行白鹭上青天。","窗含西岭千秋雪，门泊东吴万里船。"],m:"一扇窗里装下四幅画。",u:"窗景很美的时候，说「窗含西岭千秋雪」瞬间高级。"},
{t:"游子吟",a:"孟郊 · 唐",l:["慈母手中线，游子身上衣。","临行密密缝，意恐迟迟归。","谁言寸草心，报得三春晖。"],m:"母爱如春晖，难以回报。",u:"母亲节或想妈妈的时候，最深的一句就是「谁言寸草心，报得三春晖」。"},
{t:"竹石",a:"郑燮 · 清",l:["咬定青山不放松，立根原在破岩中。","千磨万击还坚劲，任尔东西南北风。"],m:"竹子扎根岩缝，任风吹打不动摇。",u:"给自己打气坚持到底：「千磨万击还坚劲」。"},
{t:"石灰吟",a:"于谦 · 明",l:["千锤万凿出深山，烈火焚烧若等闲。","粉骨碎身浑不怕，要留清白在人间。"],m:"历尽磨难也要保持清白。",u:"表达做人有底线、不怕吃苦：「要留清白在人间」。"},
{t:"元日",a:"王安石 · 宋",l:["爆竹声中一岁除，春风送暖入屠苏。","千门万户曈曈日，总把新桃换旧符。"],m:"过年辞旧迎新的热闹。",u:"春节发祝福，配「总把新桃换旧符」应景又有文化。"}
];
const IDIOMS=[
{w:"画龙点睛",s:"在关键处加上精妙一笔，让整体活起来。",e:"报告最后加了一页数据总结，画龙点睛，老师当场表扬。"},
{w:"亡羊补牢",s:"出了问题及时补救，还不算晚。",e:"这次考砸了没关系，现在开始补弱科，亡羊补牢，为时未晚。"},
{w:"井底之蛙",s:"眼界狭小、见识有限的人。",e:"多出去走走看看，别做井底之蛙。"},
{w:"闻鸡起舞",s:"听到鸡叫就起来练剑，形容勤奋自律。",e:"她每天六点起来背单词，真是闻鸡起舞的劲头。"},
{w:"卧薪尝胆",s:"刻苦自励，发愤图强。",e:"这学期他卧薪尝胆，从年级中游冲到了前十。"},
{w:"滥竽充数",s:"没本事的人混在行家里凑数。",e:"小组作业别滥竽充数，每个人都得真出力。"},
{w:"掩耳盗铃",s:"自己骗自己，明明瞒不住却硬要瞒。",e:"作业没写完还把本子藏起来，这不是掩耳盗铃嘛。"},
{w:"刻舟求剑",s:"用老办法应对已经变化的情况。",e:"用三年前的攻略来今天的迪拜旅游，纯属刻舟求剑。"},
{w:"守株待兔",s:"不主动努力，指望好运重来。",e:"机会要自己找，坐在家里守株待兔可等不来。"},
{w:"自相矛盾",s:"自己的言行前后冲突。",e:"他一边说要早睡一边熬夜刷手机，自相矛盾。"},
{w:"塞翁失马",s:"坏事可能变好事，祸福难料。",e:"航班取消反而躲过了大暴雨，真是塞翁失马，焉知非福。"},
{w:"杯弓蛇影",s:"疑神疑鬼，自己吓自己。",e:"消息没回就担心朋友生气，纯属杯弓蛇影。"},
{w:"对牛弹琴",s:"对不懂的人讲深道理，白费力气。",e:"跟完全不追剧的人聊剧情彩蛋，属于对牛弹琴。"},
{w:"狐假虎威",s:"借别人的势力吓唬人。",e:"他仗着班长的名头指挥同学，有点狐假虎威。"},
{w:"画蛇添足",s:"多此一举，反而坏事。",e:"作文已经收尾了又硬加两段，画蛇添足反而扣分。"},
{w:"东施效颦",s:"盲目模仿别人，效果适得其反。",e:"照搬别人的穿搭不看自己风格，容易东施效颦。"},
{w:"邯郸学步",s:"模仿别人不成，反而丢了自己的本领。",e:"学了一堆新方法却把基本功丢了，成了邯郸学步。"},
{w:"叶公好龙",s:"嘴上喜欢，真来了却害怕，并非真爱好。",e:"天天说想养猫，真让他铲屎又嫌麻烦，叶公好龙。"},
{w:"愚公移山",s:"下定决心，坚持不懈地做难事。",e:"单词一天背五十个，一年就是一万八，这就是愚公移山。"},
{w:"破釜沉舟",s:"断掉退路，下决心拼到底。",e:"考前一个月他卸载了所有游戏，破釜沉舟。"},
{w:"负荆请罪",s:"主动认错道歉。",e:"昨天误会了同桌，今天带奶茶负荆请罪去了。"},
{w:"三顾茅庐",s:"诚心诚意地一再邀请。",e:"社团为请学姐回来指导，三顾茅庐才请动。"},
{w:"望梅止渴",s:"用想象安慰自己，暂解眼前之急。",e:"减肥的人看美食视频过瘾，算是望梅止渴。"},
{w:"锦上添花",s:"好上加好。",e:"演讲本来就稳，配上漂亮的PPT更是锦上添花。"}
];
const KEY="feiya_learn";
let done={};try{done=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const day=Math.floor(Date.now()/86400000);
const pi=day%POEMS.length, ii=day%IDIOMS.length;
const now=new Date();
document.getElementById("dateline").textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 第 ${Object.keys(done).filter(k=>done[k]).length} 次学会`;
function save(){localStorage.setItem(KEY,JSON.stringify(done));refreshDate();try{famMark();famPing()}catch(e){}}
function refreshDate(){document.getElementById("dateline").textContent=`${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 · 已学会 ${Object.keys(done).filter(k=>done[k]).length} 条`}
function poemCard(p,idx){
  const k="p"+idx;
  return `<div class="card"><span class="tag">今日诗</span>
  <div class="ptitle">${p.t}</div><div class="pauthor">${p.a}</div>
  <div class="plines">${p.l.join("<br>")}</div>
  <div class="meaning"><b>大意</b>｜${p.m}<br><b>生活里</b>｜${p.u}</div>
  <div class="learnrow"><button class="learnbtn ${done[k]?"done":""}" onclick="toggle('${k}',this)">${done[k]?"已学会":"我学会了"}</button></div></div>`
}
function idiomCard(d,idx){
  const k="i"+idx;
  return `<div class="card"><span class="tag">今日成语</span>
  <div class="idiom-word">${d.w}</div>
  <div class="meaning"><b>意思</b>｜${d.s}<br><b>这样用</b>｜${d.e}</div>
  <div class="learnrow"><button class="learnbtn ${done[k]?"done":""}" onclick="toggle('${k}',this)">${done[k]?"已学会":"我学会了"}</button></div></div>`
}
function toggle(k,btn){done[k]=!done[k];if(!done[k])delete done[k];save();btn.classList.toggle("done",!!done[k]);btn.textContent=done[k]?"已学会":"我学会了";renderLists()}
document.getElementById("today").innerHTML=poemCard(POEMS[pi],pi)+idiomCard(IDIOMS[ii],ii);
function renderLists(){
  document.getElementById("poems").innerHTML=POEMS.map((p,i)=>`<div class="li ${done["p"+i]?"done":""}" onclick="openOne('p',${i})"><span class="no">${i+1}</span><span class="nm">${p.t} · ${p.a.split(" ")[0]}</span><span class="st">${done["p"+i]?"已学会":""}</span></div>`).join("");
  document.getElementById("idioms").innerHTML=IDIOMS.map((d,i)=>`<div class="li ${done["i"+i]?"done":""}" onclick="openOne('i',${i})"><span class="no">${i+1}</span><span class="nm">${d.w}</span><span class="st">${done["i"+i]?"已学会":""}</span></div>`).join("");
}
function openOne(type,i){
  const v=document.getElementById("today");
  v.innerHTML=type==="p"?poemCard(POEMS[i],i):idiomCard(IDIOMS[i],i);
  switchTab("today");window.scrollTo({top:0})
}
function switchTab(v){
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("on",t.dataset.v===v));
  ["today","poems","idioms"].forEach(id=>{document.getElementById(id).style.display=(id===v)?"block":"none"})
}
document.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
  if(t.dataset.v==="today")document.getElementById("today").innerHTML=poemCard(POEMS[pi],pi)+idiomCard(IDIOMS[ii],ii);
  switchTab(t.dataset.v)
});
renderLists();refreshDate();

/* 上报家庭榜（老板 2026-08-15：一家人一起学）
   这页原来只记"学会了哪几条"，不记日子，所以另存一个日子表。
   只报"今天来没来"，学了哪首诗不报。 */
var FAM_API="https://su-family.yousef-abud.workers.dev";
var DAYKEY="feiya_days", famLast="";
function famToday(){
  var d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function famMark(){
  try{
    var m={}; try{m=JSON.parse(localStorage.getItem(DAYKEY)||"{}")}catch(e){}
    m[famToday()]=1; localStorage.setItem(DAYKEY,JSON.stringify(m));
  }catch(e){}
}
function famPing(){
  try{
    var m={}; try{m=JSON.parse(localStorage.getItem(DAYKEY)||"{}")}catch(e){}
    var done=m[famToday()]?1:0;
    var k=famToday()+"|"+done; if(k===famLast)return; famLast=k;
    fetch(FAM_API+"/fam/ping",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({who:"feiya",done:done,total:1})}).catch(function(){});
  }catch(e){}
}
famPing();


/* ═══ 真实学习时长（老板 2026-08-15：进去出来不算打卡）═══
   只在「页面看得见」且「最近 90 秒有互动」的时候走秒。
   开着不动、或者切到后台，都不计时——不然这个数没意义。 */
(function(){
  var WHO="feiya", KEY="studyMins_"+WHO;
  var lastAct=Date.now(), sec=0, sentAt=0;
  function today(){var d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
  function load(){try{var o=JSON.parse(localStorage.getItem(KEY)||"{}");return (o.d===today())?(o.s|0):0}catch(e){return 0}}
  function save(){try{localStorage.setItem(KEY,JSON.stringify({d:today(),s:sec}))}catch(e){}}
  sec=load();
  ["pointerdown","keydown","touchstart","wheel","input"].forEach(function(ev){
    document.addEventListener(ev,function(){lastAct=Date.now()},{passive:true});
  });
  function report(){
    var mins=Math.floor(sec/60);
    fetch("https://su-family.yousef-abud.workers.dev/fam/ping",{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({who:WHO,mins:mins,done:((function(){try{var m=JSON.parse(localStorage.getItem('feiya_days')||'{}');return m[new Date().toISOString().slice(0,10)]?1:0}catch(e){return 0}})()),total:1,started:sec>20})
    }).catch(function(){});
  }
  setInterval(function(){
    if(document.hidden)return;                       /* 切到后台不算 */
    if(Date.now()-lastAct>90000)return;              /* 九十秒没动静，停表 */
    sec++; save();
    if(sec-sentAt>=30){ sentAt=sec; report() }       /* 每半分钟报一次 */
  },1000);
  window.addEventListener("pagehide",report);
  document.addEventListener("visibilitychange",function(){ if(document.hidden)report() });
  window.__studySec=function(){return sec};
})();
</script>
